<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NPC Blocker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">
  <header>
    <h1>NPC Blocker</h1>
    <button id="close" title="Close (Esc)">✕</button>
  </header>

  <section>
    <h2 id="formTitle">New zone</h2>

    <label class="full">Name
      <input id="name" type="text" maxlength="40" placeholder="e.g. Police station MLO">
    </label>

    <h3>Pins <span id="pinCount"></span></h3>
    <div class="row">
      <button id="pinPed">📍 Pin at my feet</button>
      <button id="pinCross">🎯 Pin at crosshair</button>
    </div>
    <div class="row">
      <button id="walk" class="primary">🚶 Walk &amp; pin (hide menu)</button>
    </div>
    <ul id="pins"></ul>
    <div class="row">
      <button id="undo">Undo last</button>
      <button id="clearPins">Clear pins</button>
    </div>
    <p class="hint">Drop pins around the outline in order, 3 or more. The shape closes itself.</p>

    <div class="grid2">
      <label>Base Z <input id="z" type="number" step="0.1"></label>
      <label>Height <input id="height" type="number" step="0.5" min="1"></label>
    </div>

    <div class="nudge">
      <div class="nudgeHead">
        Nudge step <input id="step" type="number" value="0.5" step="0.1" min="0.1">
      </div>
      <div class="nudgeBtns">
        <button data-k="z" data-d="-1">Z −</button><button data-k="z" data-d="1">Z +</button>
        <button data-k="height" data-d="-1">Height −</button><button data-k="height" data-d="1">Height +</button>
      </div>
    </div>

    <div class="toggles">
      <label><input type="checkbox" id="blockPeds"> Block ped paths / navmesh</label>
      <label><input type="checkbox" id="blockScenarios"> Block ambient scenarios</label>
      <label><input type="checkbox" id="blockVehicles"> Disable vehicle roads</label>
      <label><input type="checkbox" id="clearPeds"> Despawn NPCs inside</label>
      <label><input type="checkbox" id="clearVehicles"> Despawn NPC vehicles inside</label>
    </div>

    <div class="row">
      <button id="save" class="primary">Save zone</button>
      <button id="reset">New / Reset</button>
    </div>
    <p id="msg" class="hint">Green = zone being edited, red = saved zones.</p>
  </section>

  <section>
    <h2>Saved zones <span id="count"></span></h2>
    <ul id="list"></ul>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>
