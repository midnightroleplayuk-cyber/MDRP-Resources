<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #board {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }
  #cvs {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div id="board">
  <canvas id="cvs"></canvas>
</div>
<script>
(function() {
  var board = document.getElementById('board');
  var cvs = document.getElementById('cvs');
  var ctx = cvs.getContext('2d');
  var flashTimer = null;
  var scrollAnim = null;
  var currentText = '';
  var boardW, boardH;

  var style = {
    padX: 0,
    padY: 0,
    spacing: 0,
    offsetY: 5,
    fontScale: 85,
    brightness: 85,
    stretchX: 130,
    stretchY: 30,
    scrollSpeed: 400,
    fontColor: '#ff8800'
  };

  function parseHexColor(hex) {
    hex = (hex || '').replace(/^#/, '');
    if (hex.length === 3) {
      hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    }
    if (hex.length === 6) {
      return {
        r: parseInt(hex.substr(0, 2), 16),
        g: parseInt(hex.substr(2, 2), 16),
        b: parseInt(hex.substr(4, 2), 16)
      };
    }
    return { r: 255, g: 136, b: 0 };
  }

  function resize() {
    boardW = board.offsetWidth;
    boardH = board.offsetHeight;
    cvs.width = boardW;
    cvs.height = boardH;
    startDraw();
  }

  function getTextMetrics() {
    var fontSize = Math.max(10, Math.round(boardH * (style.fontScale / 100)));
    ctx.font = fontSize + 'px "Doto"';
    ctx.letterSpacing = (style.spacing * fontSize) + 'px';

    var fm = ctx.measureText(currentText);
    var inkTop = fm.actualBoundingBoxAscent || fontSize * 0.8;
    var inkBot = fm.actualBoundingBoxDescent || fontSize * 0.1;
    var inkH = inkTop + inkBot;
    var inkW = fm.width;
    var sx = (style.stretchX || 100) / 100;
    var scaledW = inkW * sx;

    return { fontSize: fontSize, inkTop: inkTop, inkBot: inkBot, inkH: inkH, inkW: inkW, scaledW: scaledW };
  }

  function drawFrame(scrollOffset) {
    ctx.clearRect(0, 0, boardW, boardH);
    if (!currentText) return;

    var m = getTextMetrics();
    var y = (boardH - m.inkH) / 2 + m.inkTop + (boardH * style.offsetY / 100);

    var sx = (style.stretchX || 100) / 100;
    var sy = (style.stretchY || 100) / 100;

    var x;
    if (scrollOffset !== undefined) {
      x = scrollOffset;
    } else {
      x = (boardW - m.inkW) / 2;
    }

    var br = Math.max(0, Math.min(100, style.brightness)) / 100;
    var rgb = parseHexColor(style.fontColor);
    var r = Math.round(rgb.r * br);
    var g = Math.round(rgb.g * br);
    var b = Math.round(rgb.b * br);

    ctx.save();
    ctx.translate(boardW / 2, boardH / 2);
    ctx.scale(sx, sy);
    ctx.translate(-boardW / 2, -boardH / 2);

    ctx.font = m.fontSize + 'px "Doto"';
    ctx.letterSpacing = (style.spacing * m.fontSize) + 'px';
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx.fillText(currentText, x, y);

    ctx.restore();
  }

  function stopScroll() {
    if (scrollAnim) { cancelAnimationFrame(scrollAnim); scrollAnim = null; }
  }

  function startDraw() {
    stopScroll();
    if (!currentText) { ctx.clearRect(0, 0, boardW, boardH); return; }

    var m = getTextMetrics();
    if (m.scaledW <= boardW) {
      drawFrame();
      return;
    }

    var scrollStart = boardW;
    var scrollEnd = -m.inkW;
    var speed = style.scrollSpeed || 80;
    var offset = scrollStart;
    var lastTime = null;

    function tick(ts) {
      if (!lastTime) lastTime = ts;
      var dt = (ts - lastTime) / 1000;
      lastTime = ts;

      offset -= speed * dt;
      if (offset < scrollEnd) {
        offset = scrollStart;
      }

      drawFrame(offset);
      scrollAnim = requestAnimationFrame(tick);
    }

    scrollAnim = requestAnimationFrame(tick);
  }

  function applyFlash(bpm, sequencer) {
    if (flashTimer) { clearInterval(flashTimer); flashTimer = null; }
    cvs.style.opacity = '1';
    if (!bpm || bpm <= 0 || !sequencer) return;

    var bits = [];
    for (var i = 31; i >= 0; i--) bits.push((sequencer >>> i) & 1);
    var tickMs = Math.floor(60000 / bpm);
    var idx = 0;
    flashTimer = setInterval(function() {
      cvs.style.opacity = bits[idx] === 1 ? '1' : '0';
      idx = (idx + 1) % 32;
    }, tickMs);
  }

  window.addEventListener('message', function(e) {
    var d = e.data;
    if (!d) return;

    if (d.action === 'setText' || d.action === 'update') {
      if (d.text !== undefined) { currentText = (d.text || '').toUpperCase(); startDraw(); }
      if (d.action === 'update' && (d.bpm !== undefined || d.sequencer !== undefined)) {
        applyFlash(d.bpm || 0, d.sequencer || 0);
      }
    }
    if (d.action === 'setFlash') {
      applyFlash(d.bpm || 0, d.sequencer || 0);
    }
    if (d.action === 'setStyle') {
      if (d.padX !== undefined) style.padX = d.padX;
      if (d.padY !== undefined) style.padY = d.padY;
      if (d.spacing !== undefined) style.spacing = d.spacing;
      if (d.offsetY !== undefined) style.offsetY = d.offsetY;
      if (d.fontScale !== undefined) style.fontScale = d.fontScale;
      if (d.brightness !== undefined) style.brightness = d.brightness;
      if (d.stretchX !== undefined) style.stretchX = d.stretchX;
      if (d.stretchY !== undefined) style.stretchY = d.stretchY;
      if (d.scrollSpeed !== undefined) style.scrollSpeed = d.scrollSpeed;
      if (d.fontColor !== undefined) style.fontColor = d.fontColor;
      startDraw();
    }
    if (d.action === 'clear') {
      if (flashTimer) { clearInterval(flashTimer); flashTimer = null; }
      stopScroll();
      currentText = '';
      cvs.style.opacity = '1';
      ctx.clearRect(0, 0, boardW, boardH);
    }
  });

  window.addEventListener('resize', resize);
  document.fonts.ready.then(function() { resize(); });
})();
</script>
</body>
</html>
