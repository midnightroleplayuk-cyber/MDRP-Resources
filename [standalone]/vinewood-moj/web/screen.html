<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Court screen</title>
<style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: Arial, Helvetica, sans-serif; color: #fff; }
    .layer { position: absolute; inset: 0; }
    .hidden { display: none !important; }
    #slate { background: #0b0c0c; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    #slate::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2.2vh; background: #1d70b8; }
    #slate svg { width: 11vh; height: 11vh; margin-bottom: 3vh; }
    #slate .court { font-size: 4.6vh; font-weight: 700; letter-spacing: .02em; }
    #slate .room { font-size: 8vh; font-weight: 700; margin: 1.4vh 0 2.4vh; }
    #slate .msg { font-size: 3.4vh; color: #b1b4b6; }
    #slate .clock { position: absolute; top: 3vh; right: 4vh; font-size: 3.4vh; color: #b1b4b6; }
    video, iframe, img.layer { width: 100%; height: 100%; border: 0; background: #000; object-fit: contain; }
    #tag { position: absolute; left: 3vh; top: 3vh; background: rgba(11, 12, 12, .86); border-left: 1vh solid #ffdd00; padding: 1.4vh 2.4vh; font-size: 3vh;
        transition: opacity .8s; max-width: 70%; }
    #tag small { display: block; font-size: 2.2vh; color: #b1b4b6; margin-top: .4vh; letter-spacing: .08em; text-transform: uppercase; }
    #tag.fade { opacity: 0; }
    /* Interview playback */
    #iv { background: #0b0c0c; }
    #iv video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    #ivCard { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 9vh; }
    #ivCard .k { font-size: 2.6vh; letter-spacing: .14em; text-transform: uppercase; color: #ffdd00; font-weight: 700; }
    #ivCard .who { font-size: 7vh; font-weight: 700; margin: 1.2vh 0 2.4vh; }
    #ivCard dl { display: grid; grid-template-columns: 22vh 1fr; gap: 1.1vh 2vh; font-size: 3vh; margin: 0; }
    #ivCard dt { color: #9ea3a6; }
    #ivCard dd { margin: 0; }
    #ivBar { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(11,12,12,.92); padding: 1.8vh 3vh 2.2vh; border-top: .6vh solid #1d70b8; }
    #ivSpeakers { display: flex; flex-wrap: wrap; gap: 1.2vh; margin-bottom: 1.6vh; }
    .spk { font-size: 2.5vh; padding: .7vh 1.6vh; background: #2a2d2f; color: #b1b4b6; border-left: .6vh solid #505a5f; }
    .spk.on { background: #00703c; color: #fff; border-left-color: #fff; }
    #ivProg { display: flex; align-items: center; gap: 2vh; font-size: 2.6vh; font-variant-numeric: tabular-nums; }
    #ivTrack { flex: 1; height: 1vh; background: #383f43; }
    #ivFill { height: 100%; width: 0; background: #ffdd00; }
</style>
</head>
<body>
<div id="slate" class="layer">
    <div class="clock" id="clock"></div>
    <svg viewBox="0 0 48 48"><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 6v34M14 40h20M10 14h28M24 10l-2-4h4z"/><path d="M10 14l-6 13h12zM38 14l-6 13h12z"/><path d="M4 27a6 4 0 0 0 12 0M32 27a6 4 0 0 0 12 0"/></g></svg>
    <div class="court" id="court">HM Courts &amp; Tribunals Service</div>
    <div class="room" id="room">Court</div>
    <div class="msg" id="msg">No exhibit is being shown</div>
</div>
<video id="video" class="layer hidden" playsinline></video>
<iframe id="frame" class="layer hidden" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<img id="image" class="layer hidden" alt="">
<div id="iv" class="layer hidden">
    <video id="ivVideo" muted playsinline class="hidden"></video>
    <div id="ivCard"><div class="k">Interview under caution · recording</div><div class="who" id="ivWho"></div><dl id="ivMeta"></dl></div>
    <div id="ivBar"><div id="ivSpeakers"></div><div id="ivProg"><span id="ivNow">00:00</span><div id="ivTrack"><div id="ivFill"></div></div><span id="ivTotal">00:00</span></div></div>
</div>
<div id="tag" class="hidden"><small>Exhibit</small><span id="tagText"></span></div>

<script>
    const $ = (id) => document.getElementById(id);
    const video = $('video'), frame = $('frame'), image = $('image');
    let kind = null, control = null, tagTimer, volume = 0.8, ready = false;

    const pad = (n) => String(n).padStart(2, '0');
    setInterval(() => { const d = new Date(); $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`; }, 1000);

    function slate(msg) {
        kind = null; control = null;
        stopInterview();
        video.pause(); video.removeAttribute('src'); video.load();
        frame.src = 'about:blank'; image.removeAttribute('src');
        video.classList.add('hidden'); frame.classList.add('hidden'); image.classList.add('hidden'); $('tag').classList.add('hidden');
        $('slate').classList.remove('hidden');
        $('msg').textContent = msg || 'No exhibit is being shown';
    }

    function showTag(label) {
        $('tagText').textContent = label || 'Exhibit';
        $('tag').classList.remove('hidden', 'fade');
        clearTimeout(tagTimer);
        tagTimer = setTimeout(() => $('tag').classList.add('fade'), 6000);
    }

    // YouTube and Vimeo players accept volume commands over postMessage.
    function command(vol) {
        if (!ready || !frame.contentWindow) return;
        try {
            if (control === 'youtube') frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'setVolume', args: [Math.round(vol * 100)] }), '*');
            else if (control === 'vimeo') frame.contentWindow.postMessage(JSON.stringify({ method: 'setVolume', value: vol }), '*');
        } catch (e) {}
    }

    function showImage(src) {
        video.pause(); video.classList.add('hidden'); frame.classList.add('hidden'); frame.src = 'about:blank';
        image.classList.remove('hidden');
        image.onerror = () => slate('This image could not be shown');
        image.src = src;
    }

    /* ---------- interviews: every speaker's track + CCTV against one clock ---------- */
    let iv = null;
    const clock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
    function stopInterview() {
        if (!iv) return;
        cancelAnimationFrame(iv.raf);
        iv.audio.forEach(({ el }) => { el.pause(); el.removeAttribute('src'); el.load(); });
        if (iv.video) { iv.video.el.pause(); iv.video.el.removeAttribute('src'); iv.video.el.load(); }
        iv = null;
        $('iv').classList.add('hidden');
    }
    function playInterview(m) {
        stopInterview();
        video.pause(); video.classList.add('hidden'); frame.classList.add('hidden'); frame.src = 'about:blank'; image.classList.add('hidden');
        $('slate').classList.add('hidden');
        const tracks = (m.tracks || []).filter((t) => t.url);
        const meta = m.meta || {};
        const total = Math.max(Number(m.total) || 0, ...tracks.map((t) => t.offset + (t.duration || 0)), 1000);
        $('ivWho').textContent = meta.interviewee || 'Interview';
        const rows = [['Recorded', meta.when], ['Interview room', meta.room], ['Officer', meta.officer], ['Solicitor', meta.solicitor], ['Reference', meta.caseRef]];
        $('ivMeta').innerHTML = rows.filter((r) => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${String(v).replace(/[<>&]/g, '')}</dd>`).join('');
        const speakers = [...new Set(tracks.filter((t) => t.kind !== 'video').map((t) => t.speaker || 'Unknown'))];
        $('ivSpeakers').innerHTML = speakers.map((sp, i) => `<span class="spk" data-sp="${i}">${String(sp).replace(/[<>&]/g, '')}</span>`).join('');
        $('ivTotal').textContent = clock(total);
        const vt = tracks.find((t) => t.kind === 'video');
        const vEl = $('ivVideo');
        vEl.classList.toggle('hidden', !vt);
        $('ivCard').classList.toggle('hidden', !!vt);
        iv = {
            total, base: performance.now() - (Number(m.elapsed) || 0) * 1000,
            audio: tracks.filter((t) => t.kind !== 'video').map((t) => {
                const el = new Audio(); el.preload = 'auto'; el.src = t.url; el.volume = volume;
                el.addEventListener('loadedmetadata', () => { if (!t.duration && isFinite(el.duration)) t.duration = el.duration * 1000; });
                return { t, el, sp: speakers.indexOf(t.speaker || 'Unknown') };
            }),
            video: vt ? { t: vt, el: vEl } : null,
        };
        if (vt) vEl.src = vt.url;
        $('iv').classList.remove('hidden');
        showTag(m.label);
        const sync = ({ t, el }) => {
            const local = iv.now - t.offset;
            const len = t.duration || (isFinite(el.duration) ? el.duration * 1000 : 0);
            const inside = local >= 0 && (len === 0 || local < len);
            if (!inside) { if (!el.paused) el.pause(); return false; }
            if (Math.abs(el.currentTime * 1000 - local) > 400) el.currentTime = local / 1000;
            if (el.paused) el.play().catch(() => {});
            return !el.paused;
        };
        const loop = () => {
            if (!iv) return;
            iv.now = performance.now() - iv.base;
            if (iv.now >= iv.total) { stopInterview(); slate('End of interview'); return; }
            const talking = new Set();
            iv.audio.forEach((a) => { if (sync(a)) talking.add(a.sp); });
            if (iv.video) sync(iv.video);
            document.querySelectorAll('.spk').forEach((e) => e.classList.toggle('on', talking.has(Number(e.dataset.sp))));
            $('ivNow').textContent = clock(iv.now);
            $('ivFill').style.width = `${Math.min(100, (iv.now / iv.total) * 100)}%`;
            iv.raf = requestAnimationFrame(loop);
        };
        iv.raf = requestAnimationFrame(loop);
    }

    function play(m) {
        if (m.kind === 'interview') { kind = 'interview'; control = null; return playInterview(m); }
        stopInterview();
        kind = m.kind; control = m.control || null; ready = false;
        $('slate').classList.add('hidden');
        showTag(m.label);
        // Where to start: the link's own timestamp plus how long the exhibit has been playing.
        const start = Math.max(0, Math.floor((Number(m.offset) || 0) + (Number(m.elapsed) || 0)));
        if (m.kind === 'image') { showImage(m.src); return; }
        if (m.kind === 'file') {
            frame.classList.add('hidden'); frame.src = 'about:blank'; image.classList.add('hidden');
            video.classList.remove('hidden');
            video.src = m.src;
            video.volume = volume;
            video.onloadedmetadata = () => {
                if (start > 0 && start < video.duration) video.currentTime = start;
                if (start >= video.duration) { slate('End of exhibit'); return; }
                video.play().catch(() => { video.muted = true; video.play(); });
            };
            video.onended = () => slate('End of exhibit');
            video.onerror = () => {
                if (m.fallback) return showImage(m.fallback);
                // e.g. Medal wouldn't give a direct file: use the site's own player instead.
                if (m.fallbackEmbed) return play({ ...m, kind: 'embed', src: m.fallbackEmbed, fallbackEmbed: null });
                slate('This video could not be played');
            };
            return;
        }
        // Embedded player from the site itself.
        video.pause(); video.classList.add('hidden'); image.classList.add('hidden');
        frame.classList.remove('hidden');
        frame.src = String(m.src).replace('{start}', String(start));
        frame.onload = () => { ready = true; setTimeout(() => command(volume), 900); };
    }

    function setVolume(v) {
        volume = Math.max(0, Math.min(1, Number(v) || 0));
        if (kind === 'file') video.volume = volume;
        else if (kind === 'interview' && iv) iv.audio.forEach(({ el }) => { el.volume = volume; });
        else if (control) command(volume);
    }

    window.addEventListener('message', (e) => {
        let m = e.data;
        if (typeof m === 'string') { try { m = JSON.parse(m); } catch (err) { return; } }
        if (!m || typeof m !== 'object' || !m.action) return;
        if (m.action === 'slate') {
            if (m.room) $('room').textContent = m.room;
            if (m.court) $('court').textContent = m.court;
            slate(m.msg);
        } else if (m.action === 'play') {
            play(m);
        } else if (m.action === 'volume') {
            setVolume(m.v);
        }
    });
</script>
</body>
</html>
