<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev MapScanner</title>
<style>
    :root {
        --bg-primary: #0d1117;
        --bg-secondary: #161b22;
        --bg-tertiary: #21262d;
        --bg-hover: #292e36;
        --border: #30363d;
        --text-primary: #e6edf3;
        --text-secondary: #8b949e;
        --text-muted: #656d76;
        --accent: #58a6ff;
        --accent-dim: #1f6feb33;
        --red: #f85149;
        --red-dim: #f8514933;
        --green: #3fb950;
        --green-dim: #3fb95033;
        --orange: #d29922;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        background: transparent; color: var(--text-primary);
        overflow: hidden; user-select: none;
    }

    #app {
        display: none; position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%); width: 900px; height: 640px;
        background: var(--bg-primary); border: 1px solid var(--border);
        border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,0.6);
        flex-direction: column; overflow: hidden;
    }
    #app.open { display: flex; }

    .header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 20px; background: var(--bg-secondary);
        border-bottom: 1px solid var(--border); cursor: move;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--accent-dim); color: var(--accent); font-weight: 600; }
    .header-actions { display: flex; gap: 6px; }

    .btn {
        display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
        font-size: 12px; font-weight: 500; border: 1px solid var(--border);
        border-radius: 6px; background: var(--bg-tertiary); color: var(--text-primary);
        cursor: pointer; transition: all 0.15s;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--text-muted); }
    .btn-primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .btn-primary:hover { background: #388bfd; }
    .btn-danger { color: var(--red); }
    .btn-danger:hover { background: var(--red-dim); }
    .btn-sm { padding: 3px 8px; font-size: 11px; }

    .close-btn {
        width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
        border: none; background: transparent; color: var(--text-secondary);
        cursor: pointer; border-radius: 6px; font-size: 16px;
    }
    .close-btn:hover { background: var(--red-dim); color: var(--red); }

    .stats-bar { display: flex; gap: 20px; padding: 10px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
    .stat { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
    .stat-value { font-weight: 700; font-size: 14px; color: var(--text-primary); }
    .stat-value.danger { color: var(--red); }
    .stat-value.success { color: var(--green); }

    .tabs { display: flex; padding: 0 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
    .tab { padding: 10px 16px; font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
    .tab:hover { color: var(--text-primary); }
    .tab.active { color: var(--accent); border-color: var(--accent); }
    .tab .count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; font-size: 10px; font-weight: 600; border-radius: 9px; background: var(--bg-tertiary); color: var(--text-secondary); }
    .tab .count.has-dupes { background: var(--red-dim); color: var(--red); }

    .toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border); }
    .search-box { flex: 1; padding: 7px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); color: var(--text-primary); outline: none; }
    .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
    .search-box::placeholder { color: var(--text-muted); }
    .filter-group { display: flex; gap: 4px; }
    .filter-btn { padding: 5px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); color: var(--text-secondary); cursor: pointer; }
    .filter-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

    .content { flex: 1; overflow-y: auto; padding: 12px 20px; }
    .content::-webkit-scrollbar { width: 6px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .file-group { margin-bottom: 16px; }
    .file-group-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px 8px 0 0; cursor: pointer; }
    .file-group-header:hover { background: var(--bg-tertiary); }
    .file-group-header .icon { width: 20px; text-align: center; font-size: 12px; color: var(--text-muted); }
    .file-group-header .name { flex: 1; font-size: 13px; font-weight: 600; font-family: 'Consolas', 'Fira Code', monospace; }
    .file-group-header .dup-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--red-dim); color: var(--red); font-weight: 700; }

    .file-group-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
    .file-entry { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 42px; font-size: 12px; border-bottom: 1px solid var(--border); transition: background 0.1s; }
    .file-entry:last-child { border-bottom: none; }
    .file-entry:hover { background: var(--bg-hover); }
    .file-entry .resource-tag { display: inline-block; padding: 2px 8px; font-size: 11px; font-weight: 600; font-family: 'Consolas', 'Fira Code', monospace; border-radius: 4px; background: var(--accent-dim); color: var(--accent); white-space: nowrap; }
    .file-entry .path { flex: 1; font-size: 11px; color: var(--text-muted); font-family: 'Consolas', 'Fira Code', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-entry .type-tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: var(--bg-tertiary); color: var(--text-muted); }

    .entity-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; transition: background 0.1s; }
    .entity-item:hover { background: var(--bg-hover); }
    .entity-type { width: 60px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .entity-type.object { color: var(--accent); }
    .entity-type.vehicle { color: var(--green); }
    .entity-type.ped { color: var(--orange); }
    .entity-info { flex: 1; min-width: 0; }
    .entity-info .model { font-size: 13px; font-weight: 600; font-family: 'Consolas', 'Fira Code', monospace; }
    .entity-info .meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .entity-actions { display: flex; gap: 4px; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--text-muted); }
    .empty-state .icon { font-size: 40px; opacity: 0.4; }
    .empty-state p { font-size: 14px; }

    .loading { display: flex; align-items: center; justify-content: center; height: 100%; gap: 10px; color: var(--text-secondary); font-size: 14px; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .summary-card { padding: 14px 16px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; }
    .summary-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .summary-card .value { font-size: 22px; font-weight: 700; }
    .summary-card .sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

    .hidden { display: none !important; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); padding: 8px 20px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text-primary); opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 9999; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--green); }
    .toast.error { border-color: var(--red); }
</style>
</head>
<body>
<div id="app">
    <div class="header" id="dragHandle">
        <div class="header-left">
            <h1>&#x1f5fa;&#xfe0f; Map Scanner</h1>
            <span class="badge">DEV TOOL</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="doScan()">&#x27f3; Scan Resources</button>
            <button class="btn" onclick="copyReport()" id="copyBtn">&#x1f4cb; Copy Report</button>
            <button class="close-btn" onclick="closeUI()">&#x2715;</button>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat">Resources <span class="stat-value" id="statResources">&mdash;</span></div>
        <div class="stat">Map Files <span class="stat-value" id="statFiles">&mdash;</span></div>
        <div class="stat">Duplicates <span class="stat-value danger" id="statDuplicates">&mdash;</span></div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="overview" onclick="switchTab('overview')">Overview</div>
        <div class="tab" data-tab="ymaps" onclick="switchTab('ymaps')">YMAPs <span class="count" id="countYmaps">0</span></div>
        <div class="tab" data-tab="collisions" onclick="switchTab('collisions')">Collisions <span class="count" id="countCollisions">0</span></div>
        <div class="tab" data-tab="occlusions" onclick="switchTab('occlusions')">Occlusions <span class="count" id="countOcclusions">0</span></div>
        <div class="tab" data-tab="ytyps" onclick="switchTab('ytyps')">YTYPs <span class="count" id="countYtyps">0</span></div>
        <div class="tab" data-tab="entities" onclick="switchTab('entities')">Entities</div>
    </div>

    <div class="toolbar" id="toolbar">
        <input class="search-box" id="searchBox" type="text" placeholder="Search files, resources..." oninput="onSearch()">
        <div class="filter-group">
            <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">All</button>
            <button class="filter-btn" id="filterDupes" onclick="setFilter('dupes')">Duplicates</button>
        </div>
    </div>

    <div class="content" id="content">
        <div class="empty-state"><div class="icon">&#x1f50d;</div><p>Press <b>Scan Resources</b> to begin</p></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let report = null, currentTab = 'overview', currentFilter = 'all', searchQuery = '', entities = [], isScanning = false;

    function post(event, data = {}) {
        fetch(`https://dev-mapscanner/${event}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).catch(() => {});
    }

    window.addEventListener('message', (e) => {
        switch (e.data.action) {
            case 'open': document.getElementById('app').classList.add('open'); break;
            case 'close': document.getElementById('app').classList.remove('open'); break;
            case 'scanStarted': isScanning = true; renderContent(); break;
            case 'scanComplete':
                isScanning = false; report = e.data.report;
                updateStats(); updateTabCounts(); renderContent(); break;
            case 'entityScanStarted': isScanning = true; renderContent(); break;
            case 'entityScanComplete':
                isScanning = false; entities = e.data.entities || []; renderContent(); break;
        }
    });

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeUI(); });
    function closeUI() { post('close'); }
    function doScan() { post('scan'); }
    function doEntityScan() { post('scanEntities', { radius: parseFloat(document.getElementById('entityRadius')?.value || 100) }); }

    // Drag
    (function() {
        const el = document.getElementById('app'), handle = document.getElementById('dragHandle');
        let d = false, ox, oy;
        handle.addEventListener('mousedown', (e) => { if (e.target.closest('.btn,.close-btn')) return; d = true; const r = el.getBoundingClientRect(); ox = e.clientX - r.left; oy = e.clientY - r.top; el.style.transition = 'none'; });
        document.addEventListener('mousemove', (e) => { if (!d) return; el.style.left = (e.clientX - ox) + 'px'; el.style.top = (e.clientY - oy) + 'px'; el.style.transform = 'none'; });
        document.addEventListener('mouseup', () => d = false);
    })();

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
        document.getElementById('toolbar').classList.toggle('hidden', tab === 'overview' || tab === 'entities');
        renderContent();
    }

    function setFilter(f) {
        currentFilter = f;
        document.getElementById('filterAll').classList.toggle('active', f === 'all');
        document.getElementById('filterDupes').classList.toggle('active', f === 'dupes');
        renderContent();
    }

    function onSearch() { searchQuery = document.getElementById('searchBox').value.toLowerCase().trim(); renderContent(); }

    function updateStats() {
        if (!report) return;
        document.getElementById('statResources').textContent = report.stats.resources;
        document.getElementById('statFiles').textContent = report.stats.totalFiles;
        const d = document.getElementById('statDuplicates');
        d.textContent = report.stats.duplicates;
        d.className = report.stats.duplicates > 0 ? 'stat-value danger' : 'stat-value success';
    }

    function updateTabCounts() {
        if (!report) return;
        const m = { ymaps: 'ymap', collisions: 'collision', occlusions: 'occlusion', ytyps: 'ytyp' };
        for (const [tk, ck] of Object.entries(m)) {
            const cat = report.categories.find(c => c.key === ck);
            const el = document.getElementById('count' + tk.charAt(0).toUpperCase() + tk.slice(1));
            if (cat && el) { el.textContent = cat.totalFiles; el.classList.toggle('has-dupes', cat.duplicates.length > 0); }
        }
    }

    function renderContent() {
        const c = document.getElementById('content');
        if (isScanning) { c.innerHTML = '<div class="loading"><div class="spinner"></div>Scanning resources...</div>'; return; }
        switch (currentTab) {
            case 'overview': renderOverview(c); break;
            case 'entities': renderEntities(c); break;
            default: renderCategory(c); break;
        }
    }

    function renderOverview(el) {
        if (!report) { el.innerHTML = '<div class="empty-state"><div class="icon">&#x1f50d;</div><p>Press <b>Scan Resources</b> to begin</p></div>'; return; }
        let html = '<div class="summary-grid">';
        for (const cat of report.categories) {
            const dc = cat.duplicates.length;
            html += `<div class="summary-card"><div class="label">${cat.label}</div><div class="value ${dc > 0 ? 'text-red' : 'text-green'}" style="color:var(${dc > 0 ? '--red' : '--green'})">${cat.totalFiles}</div><div class="sub">${dc > 0 ? '&#x26a0; ' + dc + ' duplicate(s)' : '&#x2713; No duplicates'}</div></div>`;
        }
        html += '</div>';
        let allDupes = [];
        for (const cat of report.categories) for (const d of cat.duplicates) allDupes.push({ ...d, category: cat.label });
        if (allDupes.length > 0) {
            html += '<h3 style="font-size:14px;margin-bottom:10px;color:var(--red);">&#x26a0; All Duplicates</h3>';
            for (const dupe of allDupes) html += renderDuplicateGroup(dupe, true);
        } else {
            html += '<div style="text-align:center;padding:30px;color:var(--green);"><div style="font-size:32px;margin-bottom:8px;">&#x2713;</div><div style="font-size:14px;font-weight:600;">No duplicates found</div><div style="font-size:12px;color:var(--text-muted);margin-top:4px;">All map files are unique across resources</div></div>';
        }
        el.innerHTML = html;
    }

    function renderCategory(el) {
        if (!report) { el.innerHTML = '<div class="empty-state"><div class="icon">&#x1f50d;</div><p>Run a scan first</p></div>'; return; }
        const m = { ymaps: 'ymap', collisions: 'collision', occlusions: 'occlusion', ytyps: 'ytyp' };
        const cat = report.categories.find(c => c.key === m[currentTab]);
        if (!cat || cat.totalFiles === 0) { el.innerHTML = `<div class="empty-state"><div class="icon">&#x1f4c2;</div><p>No ${currentTab} found</p></div>`; return; }
        const grouped = {};
        for (const file of cat.allFiles) {
            if (searchQuery && !file.name.includes(searchQuery) && !file.resource.includes(searchQuery) && !(file.relativePath || '').toLowerCase().includes(searchQuery)) continue;
            if (currentFilter === 'dupes' && !file.isDuplicate) continue;
            if (!grouped[file.name]) grouped[file.name] = [];
            grouped[file.name].push(file);
        }
        const names = Object.keys(grouped).sort();
        if (!names.length) { el.innerHTML = `<div class="empty-state"><div class="icon">&#x1f50e;</div><p>No results</p></div>`; return; }
        let html = '';
        for (const name of names) {
            const files = grouped[name], isDupe = files.length > 1;
            html += `<div class="file-group"><div class="file-group-header" onclick="this.nextElementSibling.classList.toggle('hidden')"><span class="icon">${isDupe ? '&#x26a0;' : '&#x1f4c4;'}</span><span class="name">${esc(name)}</span>${isDupe ? `<span class="dup-badge">${files.length}x DUPLICATE</span>` : ''}<span style="font-size:11px;color:var(--text-muted);">${files.length} source${files.length > 1 ? 's' : ''}</span></div><div class="file-group-body">`;
            for (const f of files) html += `<div class="file-entry"><span class="resource-tag">${esc(f.resource)}</span><span class="path" title="${esc(f.fullPath || f.relativePath)}">${esc(f.relativePath || f.fullPath)}</span><span class="type-tag">${esc(f.source || 'stream')}</span><button class="btn btn-sm" onclick="copyText('${esc(f.resource)}')">Copy</button></div>`;
            html += '</div></div>';
        }
        el.innerHTML = html;
    }

    function renderDuplicateGroup(dupe, showCat) {
        let html = `<div class="file-group"><div class="file-group-header" onclick="this.nextElementSibling.classList.toggle('hidden')"><span class="icon">&#x26a0;</span><span class="name">${esc(dupe.name)}</span>${showCat ? `<span class="type-tag">${esc(dupe.category)}</span>` : ''}<span class="dup-badge">${dupe.count}x DUPLICATE</span></div><div class="file-group-body">`;
        for (const s of dupe.sources) html += `<div class="file-entry"><span class="resource-tag">${esc(s.resource)}</span><span class="path" title="${esc(s.fullPath || s.relativePath)}">${esc(s.relativePath || s.fullPath)}</span><span class="type-tag">${esc(s.source || 'stream')}</span></div>`;
        return html + '</div></div>';
    }

    function renderEntities(el) {
        let html = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;"><label style="font-size:12px;color:var(--text-secondary);">Radius:</label><input id="entityRadius" type="number" value="100" min="10" max="500" step="10" class="search-box" style="width:80px;flex:none;"><button class="btn btn-primary" onclick="doEntityScan()">Scan Nearby Entities</button><span style="font-size:12px;color:var(--text-muted);">${entities.length} found</span></div>`;
        if (!entities.length) { el.innerHTML = html + '<div class="empty-state" style="height:auto;padding:40px 0;"><div class="icon">&#x1f441;&#xfe0f;</div><p>Scan nearby entities to see what\'s around you</p></div>'; return; }
        for (const e of entities) {
            html += `<div class="entity-item"><span class="entity-type ${e.type}">${e.type}</span><div class="entity-info"><div class="model">${e.model}</div><div class="meta">Handle: ${e.handle} &middot; Dist: ${e.distance}m &middot; Source: <b>${esc(e.source)}</b> &middot; Pos: ${e.coords.x.toFixed(1)}, ${e.coords.y.toFixed(1)}, ${e.coords.z.toFixed(1)}</div></div><div class="entity-actions"><button class="btn btn-sm" onclick="post('teleportTo',{x:${e.coords.x},y:${e.coords.y},z:${e.coords.z}})">&#x1f4cd;</button><button class="btn btn-sm" onclick="post('highlightEntity',{handle:${e.handle}})">&#x1f4a1;</button><button class="btn btn-sm btn-danger" onclick="post('deleteEntity',{handle:${e.handle}})">&#x1f5d1;</button><button class="btn btn-sm" onclick="copyText('${e.model}')">&#x1f4cb;</button></div></div>`;
        }
        el.innerHTML = html;
    }

    // ═══════════════════════════════════════
    //  Copy Report to Clipboard
    // ═══════════════════════════════════════

    function copyReport() {
        if (!report) { showToast('Run a scan first', 'error'); return; }

        const lines = [];
        const div = '\u2550'.repeat(60);
        lines.push(div, '  MAP SCANNER REPORT', '  Generated: ' + new Date().toISOString(), div, '',
            '  Resources Scanned: ' + report.stats.resources,
            '  Total Map Files:   ' + report.stats.totalFiles,
            '  Duplicates Found:  ' + report.stats.duplicates, '');

        for (const cat of report.categories) {
            lines.push(div, '  ' + cat.label.toUpperCase() + ' (' + cat.totalFiles + ' files)', div);
            if (cat.duplicates.length > 0) {
                lines.push('', '  \u26a0 ' + cat.duplicates.length + ' DUPLICATE(S):', '');
                for (const d of cat.duplicates) {
                    lines.push('    "' + d.name + '" \u2014 found ' + d.count + 'x in ' + (d.resourceCount || d.sources.length) + ' resources:');
                    for (const s of d.sources) lines.push('      \u2022 [' + s.resource + '] ' + (s.relativePath || ''));
                    lines.push('');
                }
            } else { lines.push('  \u2713 No duplicates', ''); }

            if (cat.allFiles.length > 0) {
                lines.push('  All ' + cat.label + ':');
                for (const f of cat.allFiles) lines.push('    [' + f.resource + '] ' + (f.relativePath || '') + (f.isDuplicate ? ' \u26a0 DUPE' : ''));
                lines.push('');
            }
        }
        lines.push(div, '  END OF REPORT', div);

        const text = lines.join('\n');
        const btn = document.getElementById('copyBtn');

        // Try clipboard API first, fallback to execCommand
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('Report copied to clipboard!', 'success');
            if (btn) { btn.textContent = '\u2713 Copied!'; setTimeout(() => { btn.innerHTML = '&#x1f4cb; Copy Report'; }, 2000); }
        } catch (err) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Report copied to clipboard!', 'success');
                if (btn) { btn.textContent = '\u2713 Copied!'; setTimeout(() => { btn.innerHTML = '&#x1f4cb; Copy Report'; }, 2000); }
            }).catch(() => {
                showToast('Failed to copy', 'error');
                if (btn) btn.innerHTML = '&#x1f4cb; Copy Report';
            });
        }
    }

    // ═══════════════════════════════════════

    function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;') : ''; }
    function copyText(t) { try { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px;'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('Copied: ' + t); } catch(e) {} }
    function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (type ? ' ' + type : ''); setTimeout(() => t.className = 'toast', 2500); }
</script>
</body>
</html>
