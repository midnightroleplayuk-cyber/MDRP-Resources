<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap" class="hidden" style="display:none;">
    <div class="card">
      <div class="header">
        <div class="title">PolyZone Output</div>
        <button id="close">✕</button>
      </div>

      <textarea id="text" spellcheck="false"></textarea>

      <div class="row">
        <button id="copy">Copy</button>
        <button id="copyclose">Copy & Close</button>
        <div id="status"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
