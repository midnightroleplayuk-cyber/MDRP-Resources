<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>apex_strategy, quadro</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0A0B; }
    #board { display: block; width: 100%; height: 100%; }

    /* Cabeçalho discreto, para o quadro se ler à distância dentro do
       jogo mesmo antes de alguém escrever nada. */
    #chrome {
        position: absolute; left: 0; right: 0; top: 0;
        display: flex; align-items: center; gap: 14px;
        padding: 10px 22px;
        font: 700 22px/1 Inter, "Segoe UI", Arial, sans-serif;
        color: #F4F4F5;
        background: linear-gradient(180deg, rgba(10,10,11,.78), rgba(10,10,11,0));
        pointer-events: none;
        text-shadow: 0 2px 8px rgba(0,0,0,.7);
    }
    #chrome .dot { width: 12px; height: 12px; border-radius: 50%; background: #1F5EFF; }
    #chrome .name { letter-spacing: .02em; }
    #chrome .mode {
        margin-left: auto; font-size: 17px; font-weight: 800;
        letter-spacing: .16em; text-transform: uppercase; color: #859BFF;
    }
    body.light #chrome { color: #131314; text-shadow: none;
        background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0)); }
    body.light #chrome .mode { color: #0048F0; }

    /* Padrão de calibração, ligado pelo /wbcal, invisível em jogo. */
    #calib { position: absolute; inset: 0; display: none; }
    #calib.on { display: block; }
    #calib .frame { position: absolute; inset: 0; border: .9vh solid #ff0033; }
    #calib .ruler { position: absolute; }
    #calib .ruler.t, #calib .ruler.b { left: 0; right: 0; height: 2.2%;
        background: repeating-linear-gradient(to right, #1F5EFF 0 10%, #fff 10% 20%); }
    #calib .ruler.t { top: 0; } #calib .ruler.b { bottom: 0; }
    #calib .ruler.l, #calib .ruler.r { top: 0; bottom: 0; width: 1.4%;
        background: repeating-linear-gradient(to bottom, #1F5EFF 0 10%, #fff 10% 20%); }
    #calib .ruler.l { left: 0; } #calib .ruler.r { right: 0; }
    #calib .cross i { position: absolute; background: rgba(255,60,200,.9); }
    #calib .cross .h { left: 0; right: 0; top: 50%; height: 2px; }
    #calib .cross .v { top: 0; bottom: 0; left: 50%; width: 2px; }
    #calib .vals {
        position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
        font: 700 2.3vh/1.4 Consolas, monospace; color: #cddcff; white-space: nowrap;
        text-shadow: 0 2px 8px #000;
    }
</style>
</head>
<body>

<canvas id="board"></canvas>

<div id="chrome">
    <span class="dot"></span>
    <span class="name">Quadro de estratégia</span>
    <span class="mode">Quadro</span>
</div>

<div id="calib">
    <div class="frame"></div>
    <div class="ruler t"></div><div class="ruler b"></div>
    <div class="ruler l"></div><div class="ruler r"></div>
    <div class="cross"><i class="h"></i><i class="v"></i></div>
    <div class="vals"></div>
</div>

<script src="js/board.js"></script>
<script src="js/dui.js"></script>
</body>
</html>
