<!DOCTYPE html>
<html lang="en" class="ams-reception-open" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reception preview</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css" />
  <link rel="stylesheet" href="./ams-theme.css?v=9" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #1a1c22; }
  </style>
</head>
<body>
  <div class="ams-reception is-open">
    <div class="ams-reception-panel">
      <div class="ams-reception-head">
        <div class="ams-reception-brand">
          <i class="fa-solid fa-hospital"></i>
          <div>
            <h1>Hospital Reception</h1>
            <span>Check-in</span>
          </div>
        </div>
        <button class="ams-reception-close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="ams-reception-checkin">
        <div class="ams-reception-status">
          <span class="k">Status</span>
          <span class="v">NHS · no charge</span>
        </div>
        <button class="ams-reception-checkin-btn">Check in</button>
      </div>
    </div>
  </div>
</body>
</html>
