name: name: Deploy Resources to VPS + Discord Git Log

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd "C:/Users/Administrator/Desktop/devserver/resources"
            git fetch origin
            git reset --hard origin/main
            git lfs pull
