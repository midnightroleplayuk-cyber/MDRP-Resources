name: Deploy Resources to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd "C:/Users/Administrator/Desktop/devserver/resources"
            git fetch origin
            git reset --hard origin/main
            git lfs pull

      - name: Send Discord Git Log
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "username": "MDRP Git Log",
              "embeds": [{
                  "title": "📦 GitHub Commit",
                  "description": os.environ.get("COMMIT_MESSAGE", "No commit message"),
                  "color": 5793266,
                  "fields": [
                      {"name": "👤 Author", "value": os.environ.get("COMMIT_AUTHOR", "Unknown"), "inline": True},
                      {"name": "🌿 Branch", "value": os.environ.get("BRANCH", "Unknown"), "inline": True},
                      {"name": "📁 Repository", "value": os.environ.get("REPOSITORY", "Unknown"), "inline": False}
                  ],
                  "url": os.environ.get("COMMIT_URL", ""),
                  "footer": {"text": "MDRP Git Log"}
              }]
          }

          data = json.dumps(payload).encode("utf-8")
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print("Discord response:", response.status)
          PY