<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#090c16;color:white;font-family:Arial,sans-serif;overflow:hidden}.wrap{width:100vw;height:100vh;background:linear-gradient(120deg,#1b2152,#0d172b 65%,#092f3c);display:flex;flex-direction:column;align-items:center;justify-content:center;border:24px solid #0ce0b8}.title{font-size:75px;font-weight:900;letter-spacing:6px;text-shadow:0 5px 12px #000}.sub{font-size:32px;margin-top:22px}.bar{height:44px;width:75%;margin-top:35px;background:linear-gradient(90deg,#f00 0 16%,#ff0 16% 32%,#0f0 32% 48%,#0ff 48% 64%,#00f 64% 80%,#f0f 80%)}.dot{width:32px;height:32px;border-radius:50%;background:#fff;position:absolute;bottom:9%;left:10%;animation:move 3s linear infinite alternate}@keyframes move{to{left:85%}}.clock{font-size:24px;margin-top:20px}
</style></head><body><div class="wrap"><div class="title">TV TEST OK</div><div class="sub">DUI / RENDER TARGET DIAGNOSTIC</div><div class="bar"></div><div class="clock" id="clock">Loading...</div><div class="dot"></div></div><script>setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString(),250)</script></body></html>
