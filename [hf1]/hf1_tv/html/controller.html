<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font:15px Arial,sans-serif}#overlay,#volumeModal{display:none;position:fixed;inset:0}#overlay{cursor:default}#surface{position:absolute;left:10vw;top:10vh;width:80vw;height:80vh;cursor:crosshair;touch-action:none}#help{position:absolute;top:1vh;left:10vw;right:10vw;min-height:7vh;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#121827ee;padding:8px 14px;border-radius:8px;pointer-events:auto}#help span{font-size:13px}button{background:#334155;color:#fff;border:1px solid #64748b;border-radius:6px;padding:9px 15px;cursor:pointer}button:hover{background:#475569}#volumeModal{align-items:center;justify-content:center;background:#0009}#volumePanel{background:#141c2b;border:1px solid #45556f;border-radius:14px;width:min(440px,92vw);padding:26px;box-shadow:0 16px 50px #0008}h2{margin:0 0 8px;font-size:22px}p{color:#b7c7da;font-size:13px;margin:0 0 25px}#valueRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}#volumeNumber{width:85px;padding:9px;border-radius:7px;border:1px solid #64748b;background:#0b1220;color:white;font-size:20px;text-align:center}#volumeRange{width:100%;accent-color:#38bdf8;cursor:pointer}#volumeActions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.primary{background:#087fbc;border-color:#38bdf8}#websiteHint{display:none}#keyboardBar{display:none;position:absolute;left:10vw;right:10vw;bottom:1vh;align-items:center;gap:8px;background:#121827f5;padding:9px;border-radius:8px}#keyboardText{flex:1;min-width:100px;background:#0b1220;color:white;border:1px solid #64748b;border-radius:6px;padding:10px;font:15px Arial}#keyboardError{font-size:12px;color:#fda4af;min-width:100px}#keyboardBar button{white-space:nowrap}
</style></head><body>
<div id="overlay"><div id="surface"></div><div id="help"><span>Live TV preview • Click or scroll on the video • ESC to exit. <span id="websiteHint">Use the toolbar for Google searches or website navigation. Direct typing into third-party page fields is not supported.</span></span><button id="close">Close (ESC)</button></div><div id="keyboardBar"><input id="keyboardText" type="text" maxlength="1200" placeholder="Google search or website (e.g. facebook.com)" autocomplete="off"><button id="googleSearch">Google Search</button><button id="goAddress">Go to URL</button><span id="keyboardError"></span></div></div>
<div id="volumeModal"><div id="volumePanel"><h2 id="volumeTitle">TV Volume</h2><p>Choose a precise volume level (0–100). Distance fading is applied automatically.</p><div id="valueRow"><label for="volumeRange">Volume: <strong id="volumeReadout">35 / 100</strong></label><input type="number" id="volumeNumber" min="0" max="100" step="1" value="35" aria-label="Exact volume"></div><input id="volumeRange" type="range" min="0" max="100" step="1" value="35"><div id="volumeActions"><button id="cancelVolume">Cancel</button><button id="saveVolume" class="primary">Apply volume</button></div></div></div>
<script>
const overlay=document.getElementById('overlay'),surface=document.getElementById('surface'),volumeModal=document.getElementById('volumeModal'),range=document.getElementById('volumeRange'),number=document.getElementById('volumeNumber'),readout=document.getElementById('volumeReadout');
const send=(name,data)=>fetch(`https://${GetParentResourceName()}/${name}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data||{})}).catch(()=>{});
function close(){overlay.style.display='none';volumeModal.style.display='none';send('close')}
function setVolume(v){const n=Math.max(0,Math.min(100,Math.round(Number(v)||0)));range.value=n;number.value=n;readout.textContent=n+' / 100'}
range.addEventListener('input',()=>setVolume(range.value));number.addEventListener('input',()=>{if(number.value!=='')setVolume(number.value)});number.addEventListener('blur',()=>setVolume(number.value));
window.addEventListener('message',e=>{const d=e.data||{};if(d.action==='focus'){volumeModal.style.display='none';overlay.style.display='block';document.getElementById('keyboardBar').style.display=d.website?'flex':'none';document.getElementById('keyboardError').textContent='';document.getElementById('websiteHint').style.display=d.website?'inline':'none'}else if(d.action==='hide')overlay.style.display='none';else if(d.action==='volumeOpen'){overlay.style.display='none';volumeModal.style.display='flex';document.getElementById('volumeTitle').textContent=d.mode==='new'?'Initial TV Volume':'TV Volume';setVolume(d.value)}else if(d.action==='volumeHide')volumeModal.style.display='none'});
function navigate(mode){
 const value=document.getElementById('keyboardText').value.trim(),error=document.getElementById('keyboardError');
 if(!value){error.textContent='Enter text first';return}
 error.textContent='';
 fetch(`https://${GetParentResourceName()}/websiteNavigate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,value})})
 .then(r=>r.json()).then(r=>{if(!r.ok)error.textContent=r.error||'Navigation failed';else document.getElementById('keyboardText').value=''})
 .catch(()=>{error.textContent='Navigation failed'});
}
document.getElementById('googleSearch').onclick=()=>navigate('search');
document.getElementById('goAddress').onclick=()=>navigate('address');
document.getElementById('keyboardText').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();navigate((/^(https?:\/\/)?[^\s]+\.[^\s]+(?:\/[^\s]*)?$/i.test(document.getElementById('keyboardText').value.trim()))?'address':'search')}});
document.getElementById('close').onclick=close;document.getElementById('cancelVolume').onclick=close;document.getElementById('saveVolume').onclick=()=>{const volume=Number(range.value);volumeModal.style.display='none';send('volumeSave',{volume})};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Enter'&&volumeModal.style.display==='flex'){e.preventDefault();document.getElementById('saveVolume').click()}});
function coords(e){const r=surface.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1280,y:(e.clientY-r.top)/r.height*720}}
function pointer(e,type){send('mouse',{event:type,...coords(e)})}
surface.addEventListener('mousemove',e=>pointer(e,'move'));surface.addEventListener('mousedown',e=>{if(e.button===0)pointer(e,'down')});surface.addEventListener('mouseup',e=>{if(e.button===0)pointer(e,'up')});surface.addEventListener('wheel',e=>{e.preventDefault();send('wheel',{...coords(e),delta:Math.round(-e.deltaY)})},{passive:false});surface.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
