<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;color:white;font:16px Arial}#overlay{display:none;position:fixed;inset:0;background:#0006;cursor:crosshair}#help{position:absolute;top:12px;left:12px;background:#121827;padding:14px;border-radius:8px}#surface{position:absolute;left:10%;top:12%;width:80%;height:76%;border:2px dashed #ffffff90}button{padding:8px;margin-left:8px}</style></head><body><div id="overlay"><div id="surface"></div><div id="help">TV mouse controller • click inside the dashed area to control the website • ESC to close <button id="close">Close</button><div style="font-size:12px;margin-top:6px">Keyboard input to DUI is not available through standard FiveM natives.</div></div></div><script>
const overlay=document.getElementById('overlay'),surface=document.getElementById('surface');const send=(name,data)=>fetch(`https://${GetParentResourceName()}/${name}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data||{})});function close(){overlay.style.display='none';send('close')}window.addEventListener('message',e=>{if(e.data.action==='focus')overlay.style.display='block'});document.getElementById('close').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});function pointer(e,type){const r=surface.getBoundingClientRect();send('mouse',{event:type,x:(e.clientX-r.left)/r.width*1280,y:(e.clientY-r.top)/r.height*720})}surface.addEventListener('mousemove',e=>pointer(e,'move'));surface.addEventListener('mousedown',e=>pointer(e,'down'));surface.addEventListener('mouseup',e=>pointer(e,'up'));
</script></body></html>
