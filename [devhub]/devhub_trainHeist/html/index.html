<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Heist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Force grayscale AA instead of LCD subpixel AA. On a DUI the text is
               rendered to a texture and drawn on a 3D surface, so subpixel AA bakes
               in red/cyan color fringing that reads as blur. Grayscale AA is crisp. */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            /* Logical design size is 1920x1080. The DUI canvas is rendered larger
               (see DUI_SUPERSAMPLE in c.main.lua) and `zoom` scales this layout up to
               fill it, so the screen looks identical but renders at higher resolution
               for sharper text on the monitor prop. zoom MUST match DUI_SUPERSAMPLE. */
            width: 1920px;
            height: 1080px;
            zoom: 2;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            display: none;
            background: #111;
            border: 6px solid #00ff88;
            padding: 60px;
            width: 90%;
            max-width: 1600px;
        }

        .container.active {
            display: block;
        }

        h2 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 8px;
            font-size: 56px;
        }

        .btn {
            width: 100%;
            padding: 48px;
            background: #00ff88;
            border: none;
            color: #000;
            font-size: 56px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #00cc6a;
        }

        .btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 60px;
        }

        .loading.active {
            display: block;
        }

        .loading p {
            font-size: 52px;
            font-weight: 600;
        }

        .spinner {
            width: 120px;
            height: 120px;
            border: 10px solid #333;
            border-top: 10px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 40px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .routes-grid {
            display: none;
            grid-template-columns: 1fr;
            gap: 36px;
            margin-top: 50px;
        }

        .routes-grid.active {
            display: grid;
        }

        .route-box {
            padding: 56px;
            background: #222;
            border: 5px solid #00ff88;
            text-align: center;
            cursor: pointer;
            font-size: 60px;
            font-weight: 700;
        }

        .route-box:hover {
            background: #333;
        }

        .route-box.selected {
            background: #00ff88;
            color: #000;
        }

        .progress-container {
            display: none;
            margin-top: 50px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 50px;
            background: #333;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #00ff88;
            width: 0%;
        }

        .progress-text {
            text-align: center;
            margin-top: 25px;
            color: #00ff88;
            font-size: 50px;
            font-weight: 600;
        }

        .code-display {
            display: none;
            text-align: center;
            margin-top: 50px;
        }

        .code-display.active {
            display: block;
        }

        .code-display > p {
            font-size: 42px;
        }

        .code {
            font-size: 96px;
            font-weight: bold;
            color: #00ff88;
            letter-spacing: 24px;
            padding: 40px;
            background: #222;
            margin-bottom: 30px;
        }

        .input-container {
            margin-top: 50px;
        }

        .code-input {
            width: 100%;
            padding: 40px;
            font-size: 64px;
            text-align: center;
            background: #222;
            border: 5px solid #00ff88;
            color: #00ff88;
            letter-spacing: 24px;
            outline: none;
        }

        .code-input::placeholder {
            color: #444;
            letter-spacing: 16px;
        }

        .result-display {
            display: none;
            text-align: center;
            padding: 50px;
        }

        .result-display.active {
            display: block;
        }

        .result-success {
            color: #00ff88;
            font-size: 48px;
        }

        .result-error {
            color: #ff4444;
            font-size: 48px;
        }

        .train-info {
            margin-top: 40px;
            padding: 30px;
            background: #222;
        }

        .train-info p {
            margin: 12px 0;
            font-size: 36px;
        }

        .close-hint {
            text-align: center;
            margin-top: 30px;
            color: #888;
            font-size: 32px;
        }

        /* Code entry screen for second monitor */
        #codeEntryScreen {
            display: none;
            background: #111;
            border: 6px solid #00ff88;
            padding: 60px;
            width: 90%;
            max-width: 1600px;
        }

        #codeEntryScreen.active {
            display: block;
        }

        .code-entry-title {
            text-align: center;
            color: #00ff88;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 8px;
            font-size: 48px;
        }

        .code-digit-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .code-digit-box {
            width: 100px;
            height: 120px;
            border: 4px solid #00ff88;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 64px;
            color: #00ff88;
            background: #222;
            font-family: 'Courier New', monospace;
        }

        .code-entry-hint {
            text-align: center;
            color: #888;
            font-size: 32px;
        }

        .code-entry-result {
            display: none;
            text-align: center;
            margin-top: 40px;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .code-entry-result.active {
            display: block;
        }

        .code-entry-result.success {
            color: #00ff88;
        }

        .code-entry-result.error {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div id="codeEntryScreen">
        <h2 class="code-entry-title">Enter Access Code</h2>
        <div class="code-digit-row">
            <div class="code-digit-box" id="codeDigit0"></div>
            <div class="code-digit-box" id="codeDigit1"></div>
            <div class="code-digit-box" id="codeDigit2"></div>
            <div class="code-digit-box" id="codeDigit3"></div>
            <div class="code-digit-box" id="codeDigit4"></div>
            <div class="code-digit-box" id="codeDigit5"></div>
        </div>
        <p class="code-entry-hint">Type the 6-digit code</p>
        <div class="code-entry-result" id="codeResultDisplay"></div>
        <div class="progress-container" id="codeEntryProgress">
            <div class="progress-bar">
                <div class="progress-fill" id="codeEntryProgressFill"></div>
            </div>
            <p class="progress-text" id="codeEntryProgressText">Downloading route data... 0%</p>
        </div>
        <div id="codeEntryError" style="display: none;">
            <p style="font-size: 96px; color: #ff4444; letter-spacing: 6px; margin-bottom: 40px; text-transform: uppercase; text-align: center;">SYSTEM ERROR</p>
            <p style="font-size: 60px; color: #ff4444; text-align: center;">FATAL ERROR 0x8007045D</p>
        </div>
    </div>

    <div class="container" id="hackScreen">
        <h2>Train Control System</h2>
        <button class="btn" id="hackBtn">Hack Train Routes</button>
        
        <div class="loading" id="hackLoading">
            <div class="spinner"></div>
            <p>Accessing satellite network...</p>
        </div>

        <div class="routes-grid" id="routesGrid"></div>

        <div class="progress-container" id="hackProgress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">Hacking... 0%</p>
        </div>

        <div class="code-display" id="codeDisplay">
            <p>Access Code Generated:</p>
            <div class="code" id="generatedCode"></div>
            <p class="close-hint">Remember this code!</p>
        </div>
    </div>

    <div class="container" id="codeScreen">
        <h2>Train Override Terminal</h2>
        <div class="input-container">
            <input type="text" class="code-input" id="codeInput" placeholder="______" maxlength="6">
        </div>
        <button class="btn" id="submitCode" style="margin-top: 20px;">Submit Code</button>

        <div class="progress-container" id="codeProgress">
            <div class="progress-bar">
                <div class="progress-fill" id="codeProgressFill"></div>
            </div>
            <p class="progress-text" id="codeProgressText">Verifying... 0%</p>
        </div>

        <div class="result-display" id="resultDisplay">
            <div id="resultContent"></div>
            <div class="train-info" id="trainInfo" style="display: none;">
                <p><strong>Route:</strong> <span id="trainRoute"></span></p>
                <p><strong>Cargo:</strong> <span id="trainCargo"></span></p>
                <p><strong>ETA:</strong> <span id="trainEta"></span></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
