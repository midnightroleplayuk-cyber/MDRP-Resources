<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- generic UK warning sign on an A-frame stand: used when a sign has no render yet -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- stand legs -->
    <path d="M70 168 L92 96 M130 168 L108 96" stroke="#8a97a3" stroke-width="6"/>
    <path d="M84 132 L116 132" stroke="#8a97a3" stroke-width="5"/>
    <!-- weight bag -->
    <rect x="86" y="158" width="28" height="16" rx="4" fill="#b7bcc1"/>
    <!-- warning triangle -->
    <path d="M100 30 L160 116 L40 116 Z" fill="#ffffff" stroke="#cf2b3a" stroke-width="11"/>
    <!-- exclamation -->
    <rect x="95" y="64" width="10" height="28" rx="3" fill="#15324a"/>
    <circle cx="100" cy="103" r="6" fill="#15324a"/>
  </g>
</svg>
