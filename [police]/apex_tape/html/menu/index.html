<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX Field Kit</title><link rel="stylesheet" href="fieldkit.css"></head>
<body>
<main id="app" hidden>
<section class="kit" role="dialog" aria-modal="true" aria-labelledby="title">
<aside class="rail"><div class="brand">A<span>PEX</span><small>SCENE SYSTEMS</small></div><div class="edition">FIELD<br>KIT <b>02</b></div><nav aria-label="Field kit"><button data-tab="deploy" class="active">01 <span>Deploy</span></button><button data-tab="scenes">02 <span>Scenes</span></button><button data-tab="preferences">03 <span>Preferences</span></button></nav><button id="help" class="help">? <span>Controls</span></button><div class="rail-foot">CORDON / CONTROL</div></aside>
<div class="workspace"><header><div><div class="eyebrow" id="eyebrow">EQUIPMENT / TAPE LIBRARY</div><h1 id="title">Choose your cordon.</h1></div><button id="close" class="icon" aria-label="Close field kit">×</button></header>
<div id="deployView" class="view"><p class="intro">Choose a ribbon. Mark the boundary. Take control of the scene.</p><div class="searchline"><input id="search" type="search" placeholder="Find a tape design…" aria-label="Find a tape design"><span id="designCount"></span></div><div id="options" class="cards" aria-label="Tape designs"></div><footer><div><small>READY TO DEPLOY</small><strong id="selectionLabel">Police tape</strong></div><button id="apply" class="primary">Start placing <span>↗</span></button></footer></div>
<div id="scenesView" class="view" hidden></div>
<div id="preferencesView" class="view" hidden></div>
<div id="controlsView" class="view" hidden></div>
<div id="status" role="status" aria-live="polite"></div>
</div></section></main>
<div id="placement" hidden aria-live="off"><div class="hud-top"><span class="hud-brand">APEX / LIVE</span><strong id="hudStyle"></strong><span id="hudMode"></span></div><div class="hud-metrics" id="hudMetrics"></div><div id="hudPrompt" role="status"></div><div id="hudKeys"></div></div>
<div id="notice" hidden role="status"></div>
<script src="assets.js"></script><script src="fieldkit.js"></script>
</body></html>
