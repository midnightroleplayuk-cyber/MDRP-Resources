<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.action !== 'playBell') return;
  // Only filenames are accepted, never paths or external URLs.
  if (typeof data.file !== 'string' || !/^[a-zA-Z0-9_-]+\.ogg$/i.test(data.file)) return;
  const audio = new Audio('sounds/' + data.file);
  audio.volume = Math.max(0, Math.min(1, Number(data.volume) || 0));
  audio.play().catch(() => {});
  audio.addEventListener('ended', () => { audio.src = ''; });
});
</script></body></html>
