<!DOCTYPE html>
<!--
    DUI image surface for graffiti. Loaded by client/graffiti.lua via a DUI at
    https://cfx-nui-apex_gangs/html/dui_image.html?u=<encoded image url>

    Why a LOCAL page (not the raw URL, not a data: URI):
      • a bare image URL makes CEF paint a default (dark/white) viewer background
      • a data: URI document has a null origin → CEF blocks the remote <img>
      • this local nui-origin page renders on a TRANSPARENT surface AND is allowed
        to load the remote image, so PNG transparency is preserved with no box.
-->
<html>
<head>
<meta charset="utf-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent !important; overflow: hidden; }
    #w { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: transparent; }
    #i { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; display: block; background: transparent; }
</style>
</head>
<body>
    <div id="w"><img id="i" alt=""></div>
    <script>
        (function () {
            // No crossorigin: the texture is sampled on the GPU (no canvas
            // readback), so CORS headers aren't needed — and requiring them
            // would only make remote images fail to load.
            var img = document.getElementById('i');
            function setSrc(u) { if (u) img.src = u; }
            // 1) short remote URLs come in via ?u=
            var u = new URLSearchParams(location.search).get('u') || '';
            if (u) { try { u = decodeURIComponent(u); } catch (e) {} setSrc(u); }
            // 2) large sources (custom drawings = big data: URLs) arrive via
            //    SendDuiMessage to avoid any URL-length limit.
            window.addEventListener('message', function (e) {
                var d = e.data || {};
                if (d.src) setSrc(d.src);
                // Preview is shown BLACK & WHITE while aiming; switch to full
                // colour the moment the player starts the spray animation.
                if (d.grayscale !== undefined) {
                    img.style.filter = d.grayscale ? 'grayscale(1) contrast(1.05)' : 'none';
                }
            });
        })();
    </script>
</body>
</html>
