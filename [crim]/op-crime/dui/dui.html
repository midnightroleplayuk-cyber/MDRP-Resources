<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OP CRIME GRAFFITI DUI</title>

    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.1.1/css/all.css" />

    <style>
        @font-face {
            font-family: "GraffitiYouth";
            src: url("./aAttackGraffiti.woff2") format("woff2");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            overflow: hidden;
        }

        #GraffitiBox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #graffitiText {
            font-family: "GraffitiYouth", sans-serif;
            font-weight: normal;
            font-size: 100px;
            line-height: 1;
            white-space: nowrap;
            transform-origin: center center;
            text-align: center;
            display: inline-block;
        }

        #graffitiImageBox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #graffitiImage {
            width: 512px !important;
            height: 288px !important;
            max-width: 512px !important;
            max-height: 288px !important;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div id="graffitiImageBox" style="display: none;">
        <img
            src="https://upload.wikimedia.org/wikipedia/commons/8/89/HD_transparent_picture.png"
            id="graffitiImage" alt="" />
    </div>

    <div id="GraffitiBox">
        <div id="graffitiText" style="color: #ffffff00;">Bloods Gang</div>
    </div>

    <script>
        const graffitiText = document.getElementById("graffitiText");
        const graffitiImage = document.getElementById("graffitiImage");
        const imageBox = document.getElementById("graffitiImageBox");
        const textBox = document.getElementById("GraffitiBox");

        let pendingImageToken = 0;
        let lastCustomImage = null;

        function getResourceName() {
            const host = window.location.hostname || "";
            if (host.startsWith("cfx-nui-")) {
                return host.replace("cfx-nui-", "");
            }
            return host || "op-crime";
        }

        function postToResource(endpoint, payload) {
            return fetch(`https://${getResourceName()}/${endpoint}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload || {})
            }).catch(function () {});
        }

        function scaleToFitScreen() {
            graffitiText.style.transform = "scale(1)";

            const parent = graffitiText.parentElement;
            const parentWidth = parent.offsetWidth;
            const parentHeight = parent.offsetHeight;

            const textWidth = graffitiText.scrollWidth;
            const textHeight = graffitiText.scrollHeight;

            const scaleX = parentWidth / textWidth;
            const scaleY = parentHeight / textHeight;
            const scale = Math.min(scaleX, scaleY) * 0.4;

            graffitiText.style.transform = `scale(${scale})`;
        }

        function showTextMode(gangName, color) {
            imageBox.style.display = "none";
            textBox.style.display = "flex";
            graffitiText.textContent = gangName || "No Name";
            graffitiText.style.color = color || "white";
            scaleToFitScreen();
        }

        function bustImageUrl(url) {
            const token = Date.now().toString(36);
            return url + (url.indexOf("?") >= 0 ? "&" : "?") + "_opc=" + token;
        }

        function setCustomImage(url, gangName, color) {
            if (!url || typeof url !== "string" || url.trim() === "") {
                showTextMode(gangName, color);
                postToResource("onDuiImageReady", { mode: "text" });
                return;
            }

            const token = ++pendingImageToken;
            lastCustomImage = url;

            imageBox.style.display = "flex";
            textBox.style.display = "none";

            graffitiImage.onload = function () {
                if (token !== pendingImageToken) return;
                postToResource("onDuiImageReady", { mode: "image", url: url });
            };

            graffitiImage.onerror = function () {
                if (token !== pendingImageToken) return;
                showTextMode(gangName, color);
                postToResource("onDuiImageError", { url: url });
            };

            graffitiImage.src = bustImageUrl(url.trim());
        }

        window.addEventListener("load", scaleToFitScreen);
        window.addEventListener("resize", scaleToFitScreen);

        window.addEventListener("message", function (event) {
            if (!event.data || event.data.action !== "setGangName") return;

            const gangName = event.data.gangName || "No Name";
            const color = event.data.color || "white";
            const customImage = event.data.customImage;

            if (customImage) {
                setCustomImage(customImage, gangName, color);
            } else {
                pendingImageToken++;
                showTextMode(gangName, color);
                postToResource("onDuiImageReady", { mode: "text" });
            }
        });

        window.addEventListener("DOMContentLoaded", function () {
            postToResource("onDuiReady", { ready: true });
        });
    </script>
</body>

</html>
