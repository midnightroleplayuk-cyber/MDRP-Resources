<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gang tablet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter for the interface; the graffiti fonts are only used to preview tag designs -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik+Spray+Paint&family=Bungee&family=Permanent+Marker&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="device" class="device" hidden>
  <div class="bezel">
    <span class="camera" aria-hidden="true"></span>
    <div class="screen">
      <div class="statusbar">
        <span id="clock" class="clock"></span>
        <span id="status-title" class="status-title"></span>
        <span class="status-icons"><span id="status-icons" class="status-icons"></span><button id="close" class="close" type="button" aria-label="Close tablet"></button></span>
      </div>

      <!-- Home screen: header card and app grid -->
      <section id="home" class="home" aria-label="Home screen">
        <div class="home-card">
          <img id="logo" class="logo" alt="" hidden>
          <button id="logo-add" class="logo-add" type="button" hidden></button>
          <span id="home-badge" class="home-badge" hidden></span>
          <div class="titles">
            <h1 id="tag" class="home-title"></h1>
            <p id="sub" class="home-sub"></p>
          </div>
        </div>
        <nav id="apps" class="apps" aria-label="Apps"></nav>
      </section>

      <!-- An open app -->
      <section id="app" class="app" hidden>
        <header class="appbar">
          <button id="back" class="appbar-back" type="button" aria-label="Back to home"></button>
          <h2 id="app-title" class="appbar-title"></h2>
          <span class="appbar-spacer"></span>
        </header>
        <main id="view" class="view" tabindex="-1"></main>
      </section>

      <button id="homebar" class="homebar" type="button" aria-label="Home"></button>
    </div>
  </div>
  <div id="modal" class="modal" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="icons.js"></script>
<script src="minigames.js"></script>
<script src="tag-render.js"></script>
<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
