<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Permanent+Marker&family=Rubik+Spray+Paint&family=Sedgwick+Ave+Display&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 512px; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1024" height="512"></canvas>
<script src="tag-render.js"></script>
<script>
  // Rendered inside a DUI and painted onto walls in the world
  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('c');
  if (params.has('cross')) {
    const colour = /^#[0-9a-f]{6}$/i.test(params.get('cross')) ? params.get('cross') : '#C8553D';
    drawCross(canvas, colour);
  } else {
    let spec = null;
    try { spec = JSON.parse(params.get('d') || 'null'); } catch (e) { spec = null; }
    drawTag(canvas, spec);
    // Redraw once web fonts arrive in case the first pass used the fallback
    document.fonts.ready.then(() => drawTag(canvas, spec));
  }
</script>
</body>
</html>
