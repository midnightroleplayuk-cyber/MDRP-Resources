<article class="player-document sky-identity-card sky-license-card" data-document>
  <img class="document-watermark" data-if="logo" data-image="logo" alt="" aria-hidden="true">
  <header class="document-header">
    <div class="country-mark" data-if="logo"><img data-image="logo" alt="" aria-hidden="true"></div>
    <div class="heading"><p class="country" data-if="issuer" data-field="issuer"></p><h1 data-field="title"></h1></div>
  </header>
  <div class="document-body">
    <div class="portrait-column">
      <div class="portrait" data-portrait>
        <img data-if="portrait" data-image="portrait" data-alt="holder.name">
        <svg data-if-not="portrait" viewBox="0 0 120 150" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><path class="shoulders" d="M0 150v-20c0-18 24-26 40-32h40c16 6 40 14 40 32v20Z"/><path class="neck" d="M43 82h34v27l-17 19-17-19Z"/><ellipse class="face" cx="60" cy="56" rx="30" ry="39"/><path class="hair" d="M30 60C18 16 43 9 61 9c29 0 36 21 29 51l-7-25c-18 11-31-10-46 2Z"/><path class="collar" d="m40 98 20 26 20-26 10 7-17 45H47l-17-45Z"/></svg>
      </div>
    </div>
    <div class="details">
      <div class="name-row" data-if="holder.splitName">
        <div class="field name-field"><label data-field="labels.firstName"></label><p data-field="holder.firstname" data-title="holder.firstname"></p></div>
        <div class="field name-field"><label data-field="labels.lastName"></label><p data-field="holder.lastname" data-title="holder.lastname"></p></div>
      </div>
      <div class="field name-field" data-if-not="holder.splitName"><label data-field="labels.name"></label><p data-field="holder.name"></p></div>
      <div class="field license-field">
        <label data-field="labels.licenses"></label>
        <ul class="document-licenses" tabindex="0" data-if="hasLicenses" data-aria-label="labels.licenses" data-list="licenses" data-key="item.type">
          <template><li><span data-field="item.label"></span><button type="button" class="sky-button sky-button--secondary sky-button--sm document-open" data-if="item.cardIndex" data-action="openLicense" data-index-field="item.cardIndex"><span class="sky-button__label" data-field="labels.open"></span></button></li></template>
        </ul>
        <p data-if-not="hasLicenses" data-field="labels.noLicenses"></p>
      </div>
    </div>
  </div>
  <div class="document-code" aria-hidden="true" data-list="code"><template><p data-field="item"></p></template></div>
  <footer data-if="issuer" data-field="issuer"></footer>
</article>
