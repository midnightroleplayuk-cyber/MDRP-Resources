<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030405; }
  body {
    color: #dde9ff; font-family: Consolas, "Lucida Console", "Courier New", monospace;
    text-shadow: 0 0 6px rgba(160,200,255,.45); display: flex; flex-direction: column;
    font-size: 6.6vh;
  }
  .bar { display: flex; justify-content: space-between; padding: 1.2vh 2.4vh; background: #dde9ff; color: #030405; text-shadow: none; font-weight: 700; }
  .bar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 2vh; }
  .body { flex: 1; padding: 2vh 2.8vh; display: flex; flex-direction: column; gap: .8vh; overflow: hidden; }
  .foot { padding: 1vh 2.4vh; border-top: 1px solid rgba(221,233,255,.35); font-size: .82em; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .big { font-size: 2.3em; font-weight: 700; letter-spacing: .06em; line-height: 1; }
  .mid { font-size: 1.35em; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dim { opacity: .65; }
  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 1vh; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .off { background: #000; }
  .off * { display: none; }
</style>
</head>
<body class="off">
<div class="bar"><span id="label"></span><span id="clock"></span></div>
<div class="body" id="body"></div>
<div class="foot" id="foot"></div>
<script>
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const arr = v => Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : []);
let sys = null, st = null, offset = 0, cycle = 0;
const now = () => Date.now() / 1000 + offset;
const clock = t => { const d = new Date(t * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const date = t => new Date(t * 1000).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const zoneName = z => arr(sys.zones)[z - 1] || `Zone ${z}`;

function render() {
  if (!sys || !st) return;
  document.body.classList.remove('off');
  const t = now();
  document.getElementById('label').textContent = sys.label;
  document.getElementById('clock').textContent = clock(t);
  const zones = arr(st.zones), active = arr(st.active), disabled = arr(st.disabled), faults = arr(st.faults);
  const devName = id => { const d = arr(sys.devices).find(x => x.id === id); return d ? `Z${pad(d.zone)} ${d.label}` : `Device ${id}`; };
  const overdue = sys.lastService && sys.interval && t >= sys.lastService + sys.interval * 86400;
  let body = '', foot = '';

  if (st.fire) {
    const i = zones.length ? Math.floor(cycle / 3) % zones.length : 0;
    const z = zones[i];
    const devs = arr(sys.devices).filter(d => d.zone === z && active.includes(d.id)).map(d => d.label);
    body += `<div class="big ${st.silenced ? '' : 'blink'}">FIRE</div>`;
    body += `<div class="mid">Z${pad(z)} ${esc(zoneName(z))}</div>`;
    body += `<div class="line">${devs.length ? esc(devs.join(', ')) : 'Zone input'}</div>`;
    body += `<div class="line dim">Alarm ${i + 1} of ${zones.length}${i === 0 ? ' (first)' : ''}</div>`;
    body += `<div class="line">${st.silenced ? 'Sounders silenced' : 'Sounders active'}${arr(st.sprinklers).length ? ' · Sprinklers on' : ''}</div>`;
    if (sys.dispatch) {
      const left = Math.max(0, Math.ceil((st.alarmAt + sys.dispatchDelay) - t));
      body += `<div class="line">${st.dispatched ? 'Fire service called' : `Calling fire service in ${left}s`}</div>`;
    }
  } else if (st.service) {
    body += `<div class="center"><div class="big">SERVICE</div><div class="mid">${arr(st.service.tested).length} of ${st.service.total} tested</div><div class="line">${esc(st.service.name)}</div></div>`;
  } else if (st.evacuate) {
    body += `<div class="center"><div class="big ${st.silenced ? '' : 'blink'}">EVACUATE</div><div>${st.silenced ? 'Sounders silenced' : 'All sounders active'}</div></div>`;
  } else if (st.testSounding && !st.test) {
    body += `<div class="center"><div class="big">SOUNDER TEST</div><div>Sounders running</div></div>`;
  } else if (st.test) {
    body += `<div class="center"><div class="big">TEST MODE</div><div>${st.testSounding ? 'Sounders running' : 'Walk test in progress'}</div></div>`;
  } else if (faults.length) {
    body += `<div class="center"><div class="big blink">FAULT</div>${faults.slice(0, 2).map(id => `<div class="line">${esc(devName(id))}</div>`).join('')}<div class="dim">Engineer service required</div></div>`;
  } else if (disabled.length) {
    body += `<div class="center"><div class="big blink">FAULT</div><div class="mid">Disablement</div><div class="line">${disabled.map(z => `Z${pad(z)} ${esc(zoneName(z))}`).join(', ')}</div></div>`;
  } else {
    body += `<div class="center"><div class="mid">System normal</div><div class="big">${clock(t)}</div><div class="dim">${date(t)}</div>${overdue ? '<div class="mid blink">Service overdue</div>' : ''}</div>`;
  }

  const faults = [];
  if (disabled.length && (st.fire || st.evacuate || st.test)) faults.push(`Disabled: ${disabled.map(z => 'Z' + pad(z)).join(' ')}`);
  if (st.test && !st.fire) faults.push('Test mode');
  foot = faults.length ? faults.join('   ') : 'Use the panel for full details';
  document.getElementById('body').innerHTML = body;
  document.getElementById('foot').textContent = foot;
}

setInterval(() => { cycle++; render(); }, 1000);

window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.action === 'screen') {
    sys = d.system; st = d.state;
    if (st && st.serverTime) offset = st.serverTime - Date.now() / 1000;
    render();
  } else if (d.action === 'off') {
    sys = null; st = null; document.body.classList.add('off');
  }
});
</script>
</body>
</html>
