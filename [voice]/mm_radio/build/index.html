<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FontAwesome Icons Import -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css" />
    <title>MM RADIO</title>
    <script type="module" crossorigin src="./index.js"></script>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <div id="app"></div>

    <script>
      // Custom push-to-talk sounds sent by client/event.lua.
      // Both files live in the mm_radio resource root.
      const resourceName = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'mm_radio';
      const radioSpeak = new Audio(`https://cfx-nui-${resourceName}/radio_speak.ogg`);
      const radioEnd = new Audio(`https://cfx-nui-${resourceName}/radio_end.ogg`);
      radioSpeak.preload = 'auto';
      radioEnd.preload = 'auto';

      window.addEventListener('message', (event) => {
        if (event.data?.action !== 'playRadioClick') return;

        // talking=true = PTT pressed, talking=false = PTT released.
        const sound = event.data?.data?.talking ? radioSpeak : radioEnd;
        sound.pause();
        sound.currentTime = 0;
        sound.play().catch(() => {});
      });
    </script>
    
  </body>
</html>
