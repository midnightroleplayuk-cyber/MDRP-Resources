<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rpxpawnshop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="hidden">
    <div class="panel">
      <div class="header">
        <div class="title" id="title">SELL ITEMS <span class="dollar">$</span></div>
        <div class="subtitle" id="subtitle">Sell your items for cash.</div>
      </div>

      <!-- SCROLL AREA -->
      <div class="content">
        <div class="grid" id="grid"></div>
      </div>

      <div class="footer">
        <div class="meta">
          <div>Items to Sell: <span id="count">0</span></div>
          <div>Total: <span id="total">$0</span></div>
        </div>
        <div class="actions">
          <button class="btn ghost" id="closeBtn" type="button">Close</button>
          <button class="btn primary" id="sellAllBtn" type="button">SELL ALL</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
