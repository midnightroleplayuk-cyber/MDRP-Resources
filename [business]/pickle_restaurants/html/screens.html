<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    /* The screen prop uses an OPAQUE shader, so the board paints a solid surface of
       its own. That surface is the RESTAURANT'S THEME: the page receives the same
       { primary, mode, radius } seed every scoped NUI panel gets and derives the whole
       palette from it in JS (see derive() below), emitting plain "R G B" triplets —
       identical to web/src/lib/theme.ts, so a board and the panels match. Everything is
       sized in `--u` units (1% of the stage's short edge) so the same layout reads
       correctly whatever DUI resolution the screen is calibrated to, and stays legible
       from across the room. NEVER use color-mix()/relative color syntax here: FiveM's
       CEF predates both — consume tokens as rgb(var(--x) / alpha). */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000;
      font-family: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Static fallbacks — the shipped default seed, so the board is never unstyled in
       the frames before the first data message lands. derive() overwrites them all. */
    :root {
      --brand: 255 122 46;  --brand-ink: 32 18 8;
      --bg: 22 22 25;       --card: 33 33 37;  --card-2: 44 44 49;
      --line: 62 62 68;     --ink: 244 244 246; --ink-mute: 175 173 170;
      --ok: 69 165 99;      --warn: 217 150 43;
      --r: 2;               /* corner radius multiplier, from the theme's `radius` */
    }
    /* The stage is the LOGICAL board; #root applies the prop's rot/flip so content
       lands upright on a rotated/mirrored UV (mirrors brand.html's withOrient). */
    /* Default to the full surface so the board paints a real (non-black) frame the
       instant the page loads, before any data message sizes it precisely. */
    #root { position: absolute; top: 50%; left: 50%; width: 100vw; height: 100vh;
            transform: translate(-50%, -50%); transform-origin: center center; }
    /* The BLACK default: no restaurant / no content is driving this screen, so paint a
       solid black board rather than reverting to the model's baked-in placeholder. */
    body.blk { background: #000; }
    body.blk #root { display: none; }
    #stage {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      color: rgb(var(--ink));
      /* the seed's own hue, top-lit — the brand wash reads on light + dark modes */
      background:
        radial-gradient(120% 80% at 50% -10%, rgb(var(--brand) / 0.13), transparent 60%),
        linear-gradient(180deg, rgb(var(--card)) 0%, rgb(var(--bg)) 100%);
      padding: calc(var(--u) * 4);
    }

    /* header */
    .hdr { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 2);
           padding-bottom: calc(var(--u) * 2.5); border-bottom: calc(var(--u) * 0.4) solid rgb(var(--line)); }
    .hdr .title { font-weight: 800; font-size: calc(var(--u) * 7); letter-spacing: -0.01em; line-height: 1; }
    .hdr .kicker { display: flex; align-items: center; gap: calc(var(--u) * 1.6); }
    .hdr .dot { width: calc(var(--u) * 2.2); height: calc(var(--u) * 2.2); border-radius: 50%;
                background: rgb(var(--brand)); box-shadow: 0 0 calc(var(--u)*2) rgb(var(--brand) / 0.8); }
    .hdr .eyebrow { font-family: "Spline Sans Mono", ui-monospace, monospace; text-transform: uppercase;
                    letter-spacing: 0.22em; font-size: calc(var(--u) * 2.6); color: rgb(var(--brand)); font-weight: 700; }

    .body { flex: 1; min-height: 0; position: relative; margin-top: calc(var(--u) * 3); }

    /* ── menu grid ── */
    /* Visible by DEFAULT — an offscreen DUI can't be relied on to fire the rAF that
       would flip an opacity:0 → 1 fade, which left the board reading as black. The
       `.show` class only deepens an already-visible fade-in. */
    .grid { position: absolute; inset: 0; display: grid; gap: calc(var(--u) * 2.6);
            opacity: 1; }
    .card { display: flex; align-items: center; gap: calc(var(--u) * 2.4);
            background: rgb(var(--card-2) / 0.75); border: calc(var(--u)*0.25) solid rgb(var(--line) / 0.8);
            border-radius: calc(var(--u) * var(--r)); padding: calc(var(--u) * 2.2); overflow: hidden; }
    .card .thumb { width: calc(var(--u) * 13); height: calc(var(--u) * 13); flex: 0 0 auto;
                   border-radius: calc(var(--u) * var(--r) * 0.7); background: rgb(var(--bg) / 0.6);
                   display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .card .thumb img { width: 100%; height: 100%; object-fit: contain; }
    .card .thumb .ph { font-weight: 800; font-size: calc(var(--u) * 6); color: rgb(var(--brand) / 0.7); }
    .card .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 0.6); }
    .card .name { font-weight: 700; font-size: calc(var(--u) * 4); line-height: 1.05;
                  overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .card .tag { font-family: "Spline Sans Mono", monospace; text-transform: uppercase; letter-spacing: 0.14em;
                 font-size: calc(var(--u) * 2.1); color: rgb(var(--ink-mute)); }
    .card .price { font-family: "Spline Sans Mono", monospace; font-weight: 700; font-size: calc(var(--u) * 4.6);
                   color: rgb(var(--brand)); flex: 0 0 auto; white-space: nowrap; }
    /* An empty cell on a short page: it holds its grid track (so the real cards
       stay the size they are on a full page) without reading as a missing item. */
    .card.slot { background: none; border-color: rgb(var(--line) / 0.22); }

    /* ── orders list ── */
    .orders { position: absolute; inset: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 2.2);
              opacity: 1; }
    .ticket { background: rgb(var(--card-2) / 0.75); border: calc(var(--u)*0.25) solid rgb(var(--line) / 0.8);
              border-left: calc(var(--u) * 1) solid rgb(var(--brand)); border-radius: calc(var(--u) * var(--r) * 0.8);
              padding: calc(var(--u) * 2.4); display: flex; flex-direction: column; gap: calc(var(--u) * 1.4); }
    .ticket.ready { border-left-color: rgb(var(--ok)); }
    .ticket .top { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 2); }
    .ticket .no { font-family: "Spline Sans Mono", monospace; font-weight: 800; font-size: calc(var(--u) * 5); }
    .ticket .no small { color: rgb(var(--ink-mute)); font-size: 0.55em; font-weight: 700; }
    .chip { font-family: "Spline Sans Mono", monospace; text-transform: uppercase; letter-spacing: 0.14em;
            font-weight: 700; font-size: calc(var(--u) * 2.6); padding: calc(var(--u)*1) calc(var(--u)*2);
            border-radius: calc(var(--u) * 6); background: rgb(var(--line) / 0.6); color: rgb(var(--ink-mute)); }
    .chip.ready { background: rgb(var(--ok) / 0.18); color: rgb(var(--ok)); }
    .chip.prep { background: rgb(var(--warn) / 0.18); color: rgb(var(--warn)); }
    .lines { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1.4) calc(var(--u) * 3); }
    .line { display: flex; align-items: center; gap: calc(var(--u) * 1.2); font-size: calc(var(--u) * 3.1); }
    .line .qty { font-family: "Spline Sans Mono", monospace; font-weight: 800; color: rgb(var(--brand)); }
    .line .li-img { width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6); object-fit: contain;
                    background: rgb(var(--bg) / 0.6); border-radius: calc(var(--u) * var(--r) * 0.4); }

    /* empty / footer */
    .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: calc(var(--u) * 2); color: rgb(var(--ink-mute)); text-align: center; }
    .empty .big { font-size: calc(var(--u) * 5); font-weight: 700; }
    .empty .sub { font-family: "Spline Sans Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase;
                  font-size: calc(var(--u) * 2.6); }
    .foot { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.4);
            padding-top: calc(var(--u) * 2.2); min-height: calc(var(--u) * 4); }
    .pgdot { width: calc(var(--u) * 1.4); height: calc(var(--u) * 1.4); border-radius: 50%;
             background: rgb(var(--line)); transition: all 0.3s ease; }
    .pgdot.on { background: rgb(var(--brand)); width: calc(var(--u) * 4.5); border-radius: calc(var(--u)*1); }
  </style>
</head>
<body>
  <div id="root"><div id="stage">
    <div class="hdr">
      <div class="title" id="title">Menu</div>
      <div class="kicker"><span class="eyebrow" id="eyebrow">MENU</span><span class="dot"></span></div>
    </div>
    <div class="body" id="body">
      <div class="empty"><div class="big">Loading…</div><div class="sub">connecting</div></div>
    </div>
    <div class="foot" id="foot"></div>
  </div></div>

  <script>
  (function () {
    var root = document.getElementById("root");
    var stage = document.getElementById("stage");
    var body = document.getElementById("body");
    var foot = document.getElementById("foot");
    var titleEl = document.getElementById("title");
    var eyebrowEl = document.getElementById("eyebrow");

    var state = null;         // last message
    var page = 0;             // current slideshow page
    var pages = [];           // array of page render fns
    var flipTimer = null;
    var painted = false;

    // ─── theme ────────────────────────────────────────────────────────────────
    // The board wears the RESTAURANT'S theme. It receives the same tiny seed every
    // scoped NUI panel gets — { primary, mode, radius } — and derives the whole
    // palette from it here. This is a straight port of web/src/lib/theme.ts (surfaces
    // take the seed's hue in OKLCH, status colors are OKLab blends), so a board and
    // the panels are the same palette. Emitted as plain "R G B" triplets because
    // FiveM's CEF predates color-mix()/relative color syntax.
    var DEFAULT_THEME = { primary: "#ff7a2e", mode: "dark", radius: "soft" };
    var DIALS = {
      dark:  { bg: 0.17, card: 0.215, card2: 0.265, line: 0.335, ink: 0.965, mute: 0.72, tint: 0.16 },
      paper: { bg: 0.93, card: 0.975, card2: 0.885, line: 0.8,   ink: 0.24,  mute: 0.5,  tint: 0.09 },
    };
    var RADII = { sharp: 0.6, soft: 2, round: 4 };

    function hexToRgb(hex) {
      return [parseInt(hex.slice(1, 3), 16) / 255, parseInt(hex.slice(3, 5), 16) / 255, parseInt(hex.slice(5, 7), 16) / 255];
    }
    function lin(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    function unlin(c) { return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; }
    function rgbToOklab(c) {
      var lr = lin(c[0]), lg = lin(c[1]), lb = lin(c[2]);
      var l = Math.cbrt(0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb);
      var m = Math.cbrt(0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb);
      var s2 = Math.cbrt(0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb);
      return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s2,
              1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s2,
              0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s2];
    }
    function oklabToRgb(L) {
      var l = Math.pow(L[0] + 0.3963377774 * L[1] + 0.2158037573 * L[2], 3);
      var m = Math.pow(L[0] - 0.1055613458 * L[1] - 0.0638541728 * L[2], 3);
      var s2 = Math.pow(L[0] - 0.0894841775 * L[1] - 1.291485548 * L[2], 3);
      return [unlin(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s2),
              unlin(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s2),
              unlin(-0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s2)];
    }
    function inGamut(c) { return c[0] >= -0.0001 && c[0] <= 1.0001 && c[1] >= -0.0001 && c[1] <= 1.0001 && c[2] >= -0.0001 && c[2] <= 1.0001; }
    function triplet(c) {
      return c.map(function (v) { return Math.round(Math.min(Math.max(v, 0), 1) * 255); }).join(" ");
    }
    // OKLCH → sRGB triplet, desaturating toward the L axis until it's in gamut.
    function oklch(L, C, H) {
      var c = C, rgb = oklabToRgb([L, c * Math.cos(H), c * Math.sin(H)]);
      for (var i = 0; i < 12 && !inGamut(rgb); i++) {
        c *= 0.85;
        rgb = oklabToRgb([L, c * Math.cos(H), c * Math.sin(H)]);
      }
      return triplet(rgb);
    }
    // Blend two gamma-sRGB colors in OKLab (t = share of `a`) → triplet.
    function mixLab(a, b, t) {
      var la = rgbToOklab(a), lb = rgbToOklab(b);
      return triplet(oklabToRgb([la[0] * t + lb[0] * (1 - t), la[1] * t + lb[1] * (1 - t), la[2] * t + lb[2] * (1 - t)]));
    }

    var themeSig = null; // last applied seed, so a per-tick re-push is a no-op
    function applyTheme(t) {
      t = t || {};
      var primary = /^#[0-9a-f]{6}$/i.test(t.primary || "") ? String(t.primary).toLowerCase() : DEFAULT_THEME.primary;
      var mode = DIALS[t.mode] ? t.mode : DEFAULT_THEME.mode;
      var radius = RADII[t.radius] != null ? t.radius : DEFAULT_THEME.radius;
      var sig = primary + "|" + mode + "|" + radius;
      if (sig === themeSig) return;
      themeSig = sig;

      var seed = hexToRgb(primary);
      var lab = rgbToOklab(seed);
      var C = Math.sqrt(lab[1] * lab[1] + lab[2] * lab[2]);
      var H = Math.atan2(lab[2], lab[1]);
      var d = DIALS[mode];
      var set = function (k, v) { document.documentElement.style.setProperty(k, v); };

      set("--brand", triplet(seed));
      set("--bg", oklch(d.bg, C * d.tint, H));
      set("--card", oklch(d.card, C * d.tint, H));
      set("--card-2", oklch(d.card2, C * d.tint * 1.1, H));
      set("--line", oklch(d.line, C * d.tint * 1.5, H));
      var ink = oklch(d.ink, C * 0.04, H);
      set("--ink", ink);
      set("--ink-mute", oklch(d.mute, C * 0.09, H));
      set("--ok", mixLab(hexToRgb("#45a563"), seed, 0.88));
      set("--warn", mixLab(hexToRgb("#d9962b"), seed, 0.86));
      // text on brand: 0.25 rather than the naive 0.5 — mid-luminance seeds
      // (oranges, teals) read far better against dark ink than against white
      var lum = 0.2126 * lin(seed[0]) + 0.7152 * lin(seed[1]) + 0.0722 * lin(seed[2]);
      set("--brand-ink", lum > 0.25 ? mixLab(seed, hexToRgb("#160d05"), 0.28) : mixLab(seed, hexToRgb("#ffffff"), 0.1));
      set("--r", String(RADII[radius]));
    }

    // Fit the logical stage to the surface, applying the prop's rot/flip so content
    // lands upright even on a rotated/mirrored screen UV.
    function layout(d) {
      var W = window.innerWidth, H = window.innerHeight;
      var rot = ((Math.round((d.rot || 0) / 90) * 90) % 360 + 360) % 360;
      var swap = (rot === 90 || rot === 270);
      var DW = swap ? H : W, DH = swap ? W : H;
      root.style.width = DW + "px";
      root.style.height = DH + "px";
      var fx = d.flipx ? -1 : 1, fy = d.flipy ? -1 : 1;
      root.style.transform = "translate(-50%,-50%) rotate(" + rot + "deg) scale(" + fx + "," + fy + ")";
      // 1 unit = 1% of the logical short edge → everything scales with the board.
      stage.style.setProperty("--u", (Math.min(DW, DH) / 100) + "px");
      applyTheme(d.theme);
    }

    function notifyPainted() {
      if (painted || !state || !state.res || !state.key) return;
      painted = true;
      try {
        fetch("https://" + state.res + "/screen:painted", {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=UTF-8" },
          body: JSON.stringify({ key: state.key }),
        }).catch(function () {});
      } catch (e) {}
    }

    function el(cls, html) { var e = document.createElement("div"); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
    function money(n) { n = Math.round(Number(n) || 0); return "$" + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

    function thumb(img, label) {
      var t = el("thumb");
      if (img) {
        var im = document.createElement("img");
        im.src = img;
        im.onerror = function () { t.innerHTML = ""; t.appendChild(el("ph", esc((label || "?").charAt(0).toUpperCase()))); };
        t.appendChild(im);
      } else {
        t.appendChild(el("ph", esc((label || "?").charAt(0).toUpperCase())));
      }
      return t;
    }

    // Break a list into pages of `per` items.
    function paginate(list, per) {
      var out = [];
      for (var i = 0; i < list.length; i += per) out.push(list.slice(i, i + per));
      return out.length ? out : [[]];
    }

    // The menu board is a FIXED 2 x 4 grid — 8 items a page, whatever the stage
    // aspect. It used to be derived (1 x 6 on a portrait board, 2 x 4 on a wide one)
    // with auto rows, which meant a short last page stretched its cards to fill the
    // stage: every flip changed the card size and the board read as broken. Fixed
    // rows + blank filler cells keep every page laid out identically.
    function menuLayout() {
      return { cols: 2, rows: 4, per: 8 };
    }

    function itemPage(chunk, cols, rows, section) {
      return function () {
        eyebrowEl.textContent = section ? String(section).toUpperCase() : "MENU";
        var g = el("grid");
        g.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
        // TEMPLATE rows, not auto rows: the page always reserves all `rows` tracks,
        // so a page with 3 items sits its cards at the same size as a full one.
        g.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
        chunk.forEach(function (it) {
          var card = el("card");
          card.appendChild(thumb(it.image, it.label));
          var info = el("info");
          info.appendChild(el("name", esc(it.label)));
          if (it.kind) info.appendChild(el("tag", esc(it.kind === "drink" ? "Drink" : "Food")));
          card.appendChild(info);
          card.appendChild(el("price", money(it.price)));
          g.appendChild(card);
        });
        // Pad the short last page with empty cells so the filled cards keep their
        // place in the grid instead of spreading across it.
        for (var i = chunk.length; i < cols * rows; i++) g.appendChild(el("card slot"));
        return g;
      };
    }

    function renderMenu(d) {
      titleEl.textContent = d.title || "Menu";
      eyebrowEl.textContent = "MENU";
      // Lua encodes an EMPTY list as {} (object), so guard before .slice().
      var items = Array.isArray(d.items) ? d.items.slice() : [];
      if (!items.length) { renderEmpty("Menu coming soon", "check back shortly"); return; }
      pages = [];
      if (items.length) {
        var lay = menuLayout();
        // SECTIONED, not one flat run. The Lua already ordered the list by group, so
        // walking it in order and cutting a new bucket whenever the group changes
        // keeps every page to ONE category and lets its name lead the page — a menu
        // board reads as sections, not as an alphabetical index. A page is never
        // shared between two groups, so a short section pads like any short page.
        var buckets = [], cur = null, curKey = null;
        items.forEach(function (it) {
          var g = (typeof it.group === "string" && it.group) ? it.group : "";
          if (!cur || g !== curKey) { cur = { group: g, items: [] }; curKey = g; buckets.push(cur); }
          cur.items.push(it);
        });
        buckets.forEach(function (b) {
          paginate(b.items, lay.per).forEach(function (chunk) {
            pages.push(itemPage(chunk, lay.cols, lay.rows, b.group));
          });
        });
      }
      showPages();
    }

    function renderOrders(d) {
      titleEl.textContent = d.title || "Orders";
      eyebrowEl.textContent = "NOW PREPARING";
      var orders = (d.orders || []).slice(); // already newest-first from Lua
      if (!orders.length) { renderEmpty("No open orders", "all caught up"); return; }
      // Portrait boards fit ~4 tickets, wider ones ~3 taller cards; paginate the rest.
      var per = (root.offsetWidth / root.offsetHeight >= 1.15) ? 3 : 4;
      var chunks = paginate(orders, per);
      pages = chunks.map(function (chunk) {
        return function () {
          var wrap = el("orders");
          chunk.forEach(function (o) {
            var tk = el("ticket" + (o.ready ? " ready" : ""));
            var top = el("top");
            top.appendChild(el("no", "#" + esc(o.ticket) + " <small>TICKET</small>"));
            top.appendChild(el("chip " + (o.ready ? "ready" : "prep"), o.ready ? "Ready" : "Preparing"));
            tk.appendChild(top);
            var lines = el("lines");
            (o.items || []).forEach(function (li) {
              var ln = el("line");
              ln.appendChild(el("qty", esc(li.qty) + "×"));
              if (li.image) { var im = document.createElement("img"); im.className = "li-img"; im.src = li.image; im.onerror = function () { im.style.display = "none"; }; ln.appendChild(im); }
              ln.appendChild(el(null, esc(li.label)));
              lines.appendChild(ln);
            });
            tk.appendChild(lines);
            wrap.appendChild(tk);
          });
          return wrap;
        };
      });
      showPages();
    }

    function renderEmpty(big, sub) {
      pages = [];
      body.innerHTML = "";
      foot.innerHTML = "";
      var e = el("empty");
      e.appendChild(el("big", esc(big)));
      e.appendChild(el("sub", esc(sub)));
      body.appendChild(e);
      foot.innerHTML = "";
      notifyPainted();
    }

    // Render the current page and (re)arm the slideshow if there's more than one.
    function showPages() {
      if (flipTimer) { clearInterval(flipTimer); flipTimer = null; }
      if (page >= pages.length) page = 0;
      drawPage();
      if (pages.length > 1) {
        flipTimer = setInterval(function () { page = (page + 1) % pages.length; drawPage(); }, 7000);
      }
    }

    function drawPage() {
      body.innerHTML = "";
      var node = pages[page] ? pages[page]() : el("empty");
      if (node.classList) node.classList.add("show");
      body.appendChild(node);
      // page dots
      foot.innerHTML = "";
      if (pages.length > 1) {
        for (var i = 0; i < pages.length; i++) foot.appendChild(el("pgdot" + (i === page ? " on" : "")));
      }
      notifyPainted();
    }

    // Solid-black board — the default when nothing is driving this screen. Clear the
    // content and let the `.blk` background show through, then ACK so Lua binds the
    // texture against the painted black frame.
    function renderBlack() {
      if (flipTimer) { clearInterval(flipTimer); flipTimer = null; }
      pages = [];
      body.innerHTML = "";
      foot.innerHTML = "";
      notifyPainted();
    }

    function render() {
      if (!state) return;
      var black = state.action === "black";
      document.body.classList.toggle("blk", black);
      if (black) { renderBlack(); return; }
      if (state.action === "orders") renderOrders(state);
      else renderMenu(state);
    }

    window.addEventListener("message", function (e) {
      var d = e.data;
      if (typeof d === "string") { try { d = JSON.parse(d); } catch (_) { return; } }
      if (!d) return;
      // Reset the slideshow to page 0 only when the CONTENT identity changes, so a
      // periodic no-op re-push (or an orientation tweak) doesn't yank the page back.
      var sig = d.action + "|" + (d.title || "") + "|" +
                ((Array.isArray(d.items) ? d.items : []).length) + "|" +
                ((Array.isArray(d.orders) ? d.orders : []).length);
      if (!state || sig !== state._sig) { page = 0; painted = false; } // re-notify Lua to rebind against the new content
      d._sig = sig;
      state = d;
      layout(d);
      render();
    });

    window.addEventListener("resize", function () { if (state) { layout(state); render(); } });
  })();
  </script>
</body>
</html>
