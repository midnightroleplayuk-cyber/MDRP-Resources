<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RSVX Arcade leaderboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
html, body { width: 512px; height: 648px; overflow: hidden; background: #0d0c0b; color: #efe6cf;
    font-family: Impact, "Arial Narrow", "Helvetica Neue", Arial, sans-serif; }
#rows { position: absolute; left: 22px; right: 22px; top: 18px; }
.row { display: flex; align-items: baseline; height: 52px; border-bottom: 2px solid #26221c; font-size: 34px; letter-spacing: 1px; }
.row .pos { width: 58px; color: #8d8468; }
.row .name { flex: 1; overflow: hidden; white-space: nowrap; text-transform: uppercase; }
.row .score { width: 110px; text-align: right; }
.row.first { color: #f2c14a; }
.row.first .pos { color: #f2c14a; }
#empty { position: absolute; left: 0; right: 0; top: 240px; text-align: center; font-size: 36px; color: #8d8468; text-transform: uppercase; }
#footer { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; line-height: 70px; text-align: center;
    background: #b3261c; color: #f4e6c2; font-size: 32px; letter-spacing: 1px; text-transform: uppercase; border-top: 4px solid #f2c14a; }
</style>
</head>
<body>
<div id="rows"></div>
<div id="empty">No scores yet</div>
<div id="footer"></div>
<script>
function render(data) {
    const rows = (data.rows || []).slice(0, 10);
    const box = document.getElementById('rows');
    box.textContent = '';
    rows.forEach((r, i) => {
        const row = document.createElement('div');
        row.className = 'row' + (i === 0 ? ' first' : '');
        for (const [cls, text] of [['pos', i + 1], ['name', r.name], ['score', r.score]]) {
            const cell = document.createElement('span');
            cell.className = cls;
            cell.textContent = text;
            row.appendChild(cell);
        }
        box.appendChild(row);
    });
    document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
    const footer = document.getElementById('footer');
    footer.textContent = data.footer || '';
    footer.style.display = data.footer ? 'block' : 'none';
}
window.addEventListener('message', e => {
    let d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (err) { return; } }
    if (d) render(d);
});
render({});
</script>
</body>
</html>
