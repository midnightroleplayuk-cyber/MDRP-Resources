<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rex Pool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="mockbg" class="hidden"></canvas>

<!-- Scorebug (top centre) -->
<div id="scoreboard" class="hidden"></div>

<!-- Aim HUD (bottom centre) -->
<div id="hud" class="hidden">
  <div class="hud-bar">
    <div class="hud-spin">
      <div class="spin-ball" id="spinBall">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="19" fill="#ece6d8"/>
          <circle cx="20" cy="20" r="19" fill="url(#rpShade)"/>
          <path d="M20 4v32M4 20h32" stroke="rgba(20,20,20,.28)" stroke-width=".6"/>
          <circle cx="20" cy="20" r="9.5" fill="none" stroke="rgba(20,20,20,.22)" stroke-width=".6"/>
        </svg>
        <div class="spin-dot" id="spinDot"></div>
      </div>
      <div class="hud-spin-txt"><label class="cap" data-l="key_spin"></label><div id="spinLabel"></div></div>
    </div>
    <div class="hud-sep"></div>
    <div class="hud-power">
      <div class="hud-row"><div class="hud-phase" id="hudPhase"></div><div class="power-value" id="powerValue"></div></div>
      <div class="power-track"><div class="power-fill" id="powerFill"></div><div class="power-ticks"></div></div>
      <div class="hud-tags" id="hudTags"></div>
    </div>
  </div>
  <div class="hud-keys" id="hudKeys"></div>
</div>

<!-- Modal windows -->
<div id="modal" class="hidden">
  <div class="window" id="window" role="dialog" aria-modal="true"></div>
</div>

<div id="toasts"></div>
<div id="calib" class="hidden"></div>

<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
